        '门口的牌子我认识。上一次来，我在这里叫了很久。',
        '今天没走那条有草的路。'
      ],
      vet: [
        '车停在一个我认识的地方。我不太想下车。',
        '今天身上有点不对劲。你比我先发现。',
        '我闻到了消毒水的味道，往你腿后面退了半步。',
        '这一路上我一直贴着你，你也一直没把我放下。'
      ],
      bath: [
        '水声一响，我就知道躲不掉了。',
        '你卷起袖子的样子，我一看就明白。',
        '今天的地板是湿的，我也是。'
      ],
      surgery: [
        '今天没有早饭。我知道要发生点什么。',
        '空气里有药味，跟平时不一样。',
        '你抱我的时候比平常紧一点。'
      ],
      deworm: [
        '你翻我后颈的动作，我认得。',
        '又到了这个日子。',
        '那个小瓶子一拿出来，我就开始躲。'
      ]
    },

    /* 大事那天的标题 */
    titleBig: {
      vaccine: ['今天挨了一下', '打针的那天', '我忍住了', '一下就好', '今天有正事'],
      vet: ['去看医生', '今天去了医院', '我没事，你别皱眉', '白大褂的人', '不太舒服的一天'],
      bath: ['洗澡日', '水声之后', '湿透了的一天', '我不喜欢水', '洗完还是香的'],
      surgery: ['手术那天', '醒来第一眼是你', '睡了一觉', '今天很长', '有点疼，但你在'],
      deworm: ['又到这一天', '后颈一凉', '小瓶子的日子', '例行的事'],
      status: ['今天状态很好', '一切都在位上', '满格的一天', '状态：好']
    },

    noteTpl: [      '你写下：「{n}」。我不识字，但我猜那里面有我。',
      '你在手机上记了一笔：「{n}」。字很小，可我知道你在说我。',
      '你说了一句「{n}」，语气很轻。我记下了。'
    ],

    /* 自定义性格：先引用你写的，再决定要不要补一句 */
    personQuote: [
      '你写我是个「{x}」的家伙。我承认一半。',
      '你说我「{x}」。你比我自己还清楚我。',
      '「{x}」——这话是你写的，我记下了。',
      '你在本子上形容我：「{x}」。我今天就按这个演。'
    ],
    personCustom: [
      '你懂我，所以我不必解释。',
      '我做我自己。你也在旁边做你自己。挺好。',
      '我不知道这算不算性格。我只知道今天我想这样过。'
    ],

    /* 自定义事件：{x} 是你给它起的名字。
       写成"我正在经历的事"，不写成"你记了一笔所以我认了"。 */
    custom: [
      '你把我按在腿上做「{x}」。我假装要跑，其实一动没动。',
      '「{x}」，前后不到五分钟。这五分钟里我看了你八次。',
      '做「{x}」的时候你一直跟我说话。我一句没听懂，但声音是好的。',
      '「{x}」完事，你给了我一块冻干。所以我决定记得香一点。',
      '今天做了「{x}」。我不喜欢，但我忍住了，因为你在旁边。',
      '「{x}」的时候我盯着你的手。你的手指头有点抖，比我还紧张。'
    ],
  };

  /* ---------------- 随机与去重 ---------------- */

  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36);
  }
  function seedOf(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clean(pool) {
    return (pool || []).filter(function (s) { return typeof s === 'string' && s.length; });
  }

  /* 从池中选一句：优先没被用过的；{n} 需要 ctx.num 才可选 */
  function pick(rng, pool, used, ctx) {
    pool = clean(pool);
    if (ctx && !ctx.num) pool = pool.filter(function (s) { return s.indexOf('{n}') < 0; });
    if (!pool.length) return '';
    var fresh = pool.filter(function (s) { return !used[hash(s)]; });
    var arr = fresh.length ? fresh : pool;
    var line = arr[Math.floor(rng() * arr.length)];
    used[hash(line)] = 1;
    return line;
  }

  /* ---------------- 心情 ---------------- */

  function has(events, t) {
    return events.some(function (e) { return e.type === t; });
  }

  function computeMood(events) {
    var worse = events.some(function (e) {
      return e.type === 'status' && (e.opt === '不舒服' || e.opt === '有点蔫');
    });
    if (worse || has(events, 'vomit') || has(events, 'vet') || has(events, 'surgery')) return 'sick';
    if (has(events, 'naughty')) return 'proud';
    if (has(events, 'walk') || has(events, 'play')) return 'excited';
    if (has(events, 'cuddle') || has(events, 'med')) return 'love';
    if (events.some(function (e) { return e.type === 'status' && e.opt === '很好'; })) return 'happy';
    if (has(events, 'sleep') && events.length === 1) return 'sleepy';
    if (has(events, 'meal') || has(events, 'water') || has(events, 'poop')) return 'calm';
    if (has(events, 'bath') || has(events, 'weight')) return 'sleepy';
    return 'calm';
  }

  /* 事件显示名：内置的用 PT.TYPE，自定义的用你自己起的名字 */
  function labelOf(e) {
    if (!e) return '';
    var t = PT.TYPE[e.type];
    return t ? t.label : (e.label || e.type || '');
  }

  /* ---------------- 段落组织 ---------------- */

  var PROMINENT = { vomit: 0, vet: 1, vaccine: 1.5, deworm: 2.5, med: 2, bath: 3, naughty: 4, status: 6 };

  function pickBeats(events) {
    var seen = {};
    var list = [];
    events.slice().sort(function (a, b) {
      return (a.at || 0) - (b.at || 0);
    }).forEach(function (e) {
      if (!e || !e.type || seen[e.type]) {
        if (e && e.type && seen[e.type]) seen[e.type].count++;
        return;
      }
      var b = { type: e.type, num: e.num, opt: e.opt, count: 1, at: e.at, label: e.label };
      seen[e.type] = b;
      list.push(b);
    });
    var MAX = 5;
    if (list.length <= MAX) return list;
    // 太长的日子：保留最早的 2 条 + 最重要的几条
    var keep = list.slice(0, 2);
    var rest = list.slice(2).sort(function (a, b) {
      var pa = PROMINENT[a.type] == null ? 9 : PROMINENT[a.type];
      var pb = PROMINENT[b.type] == null ? 9 : PROMINENT[b.type];
      return pa - pb;
    });
    keep = keep.concat(rest).slice(0, MAX);
    keep.sort(function (a, b) { return (a.at || 0) - (b.at || 0); });
    return keep;
  }

  function fmtNum(n) {
    if (n == null || n === '') return '';
    var v = Number(n);
    if (!isFinite(v)) return String(n);
    return (Math.round(v * 10) / 10).toString();
  }

  function beatLines(b, pet) {
    var species = pet.species === 'dog' ? 'dog' : 'cat';
    var B = LEX.beat;
    var lines = [];
    switch (b.type) {
      case 'meal':
        lines = b.count >= 2 ? B.mealMulti.concat(B.meal) : B.meal;
        break;
      case 'poop':
        if (b.opt && B.poopOpt[b.opt]) lines = B.poopOpt[b.opt].concat(B.poop);
        else lines = B.poop;
        break;
      case 'walk':
        lines = B.walk.concat(species === 'dog' ? B.walkDog : B.walkCat);
        break;
      case 'status':
        lines = B.statusOpt[b.opt] || B.status;
        break;
      default:
        lines = B[b.type] || (PT.TYPE[b.type] ? [] : LEX.custom);
    }
    return lines;
  }

  /* ---------------- 主函数 ---------------- */

  function generate(opt) {
    opt = opt || {};
    var pet = opt.pet || {};
    var date = opt.date || PT.todayKey();
    var events = (opt.events || []).filter(function (e) { return e && e.type; });
    var note = (opt.note || '').trim();
    var reroll = opt.reroll || 0;
    var history = opt.history || [];

    var rng = mulberry32(seedOf(
      date + '|' + (pet.name || '') + '|' + (pet.personality || '') + '|' + (pet.personalityText || '') + '|' + reroll + '|' + events.length + '|' + (opt.media || []).length
    ));
    var used = {};
    history.forEach(function (h) { used[h] = 1; });

    var mood = computeMood(events);
    var beats = pickBeats(events);
    var species = pet.species === 'dog' ? 'dog' : 'cat';
    var paras = [];

    /* 今天最"重"的那件事：开场和标题要先照顾它 */
    var lead = beats.slice().sort(function (a, b) {
      var pa = PROMINENT[a.type] == null ? 9 : PROMINENT[a.type];
      var pb = PROMINENT[b.type] == null ? 9 : PROMINENT[b.type];
      return pa - pb;
    })[0];

    var opener = pick(rng, LEX.open.concat(species === 'dog' ? LEX.openDog : LEX.openCat), used);
    if (lead && LEX.openBig[lead.type] && rng() < 0.72) {
      opener = pick(rng, LEX.openBig[lead.type], used, {}) || opener;
    }
    paras.push(opener);

    beats.forEach(function (b) {
      var line = pick(rng, beatLines(b, pet), used, { num: b.num != null && b.num !== '' });
      if (!line) return;
      if (line.indexOf('{n}') >= 0) line = line.replace(/\{n\}/g, fmtNum(b.num));
      if (line.indexOf('{x}') >= 0) line = line.replace(/\{x\}/g, (b.label || labelOf(b)).replace(/[「」]/g, ''));
      paras.push(line);
    });

    var ptxt = (pet.personalityText || '').trim();
    var isCustom = pet.personality === 'custom' || (!LEX.person[pet.personality] && !!ptxt);
    var media = opt.media || [];
    var hasPhoto = false, hasVideo = false;
    media.forEach(function (m) {
      if (m && m.kind === 'photo') hasPhoto = true;
      if (m && m.kind === 'video') hasVideo = true;
    });
    if (hasPhoto || hasVideo) {
      paras.push(pick(rng, LEX.photo.concat(hasVideo ? LEX.videoShot : []), used));
    }

    if (isCustom) {
      if (ptxt && rng() < 0.8) {
        paras.push(pick(rng, LEX.personQuote, used).replace(/\{x\}/g, ptxt.replace(/[「」]/g, '')));
      } else if (rng() < 0.4) {
        paras.push(pick(rng, LEX.personCustom, used));
      }
    } else if (rng() < 0.62) {
      paras.push(pick(rng, LEX.person[pet.personality] || LEX.person.aloof, used));
    }

    paras.push(pick(rng, LEX.observe, used));

    if (note) {
      var tpl = pick(rng, LEX.noteTpl, used);
      paras.push(tpl.replace(/\{n\}/g, note.replace(/[「」]/g, '')));
    }

    paras.push(pick(rng, LEX.close, used));

    var titles = LEX.title[mood] || LEX.title.calm;
    var title = '';
    if (lead && LEX.titleBig[lead.type] && rng() < 0.8) {
      title = pick(rng, LEX.titleBig[lead.type], used, {});
    }
    if (!title) title = pick(rng, titles, used);

    var tags = [];
    beats.forEach(function (b) {
      var label = labelOf(b);
      if (label && tags.indexOf(label) < 0) tags.push(label);
    });

    return {
      title: title,
      body: paras.filter(Boolean).join('\n'),
      mood: mood,
      tags: tags.slice(0, 3),
      used: Object.keys(used),
      seed: reroll
    };
  }

  /* 首屏的一句话（按日期稳定，不随刷新乱跳） */
  var FLAVOR = [
    '我在这儿。',
    '今天也要记我吗？',
    '你先忙，我看着你。',
    '我把今天留了一个位置给你。',
    '有点无聊，但还好有你。',
    '我刚睡醒。你呢？',
    '今天可以摸我三次。',
    '我在想一件很重要的事。想不起来了。'
  ];
  function flavor(pet, dateKey) {
    var i = seedOf((pet && pet.name ? pet.name : '') + '|' + (dateKey || PT.todayKey())) % FLAVOR.length;
    return FLAVOR[i];
  }

  function greeting() {
    var h = new Date().getHours();
    if (h < 5) return '这么晚还没睡。';
    if (h < 11) return '早上好。';
    if (h < 14) return '中午了，吃饭了吗。';
    if (h < 18) return '下午的光很好。';
    if (h < 23) return '天黑了。';
    return '该睡了。';
  }

  PT.WRITER = {
    generate: generate,
    flavor: flavor,
    greeting: greeting,
    computeMood: computeMood,
    _lex: LEX
  };
})();

</script>
<script>
/* media.js — 照片/视频：压一压，然后存进 IndexedDB（localStorage 装不下这些字节） */
(function () {
  'use strict';
  var PT = (window.PT = window.PT || {});

  var DB_NAME = 'pawseye.media.v1';
  var STORE = 'files';
  var _db = null;

  function db() {
    if (_db) return _db;
    _db = new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error('这个浏览器不支持本地存文件')); return; }
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('打不开本地库')); };
    });
    return _db;
  }

  function put(id, blob) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction(STORE, 'readwrite');
        t.objectStore(STORE).put(blob, id);
        t.oncomplete = function () { res(id); };
        t.onerror = function () { rej(friendly(t.error)); };
        t.onabort = function () { rej(friendly(t.error)); };
      });
    });
  }

  /* 空间满了 / 私密模式禁写：换成一句人话 */
  function friendly(err) {
    var name = (err && err.name) || '';
    if (name === 'QuotaExceededError') {
      return new Error('这台设备上放不下了，先删几个旧视频再试');
    }
    if (name === 'InvalidStateError' || name === 'NotAllowedError') {
      return new Error('浏览器不让存（可能是无痕模式）');
    }
    return new Error((err && err.message) || '存不进去');
  }

  function get(id) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction(STORE, 'readonly');
        var r = t.objectStore(STORE).get(id);
        r.onsuccess = function () { res(r.result || null); };
        r.onerror = function () { rej(r.error); };
      });
    }).catch(function () { return null; });
  }

  function del(id) {
    return db().then(function (d) {
      return new Promise(function (res) {
        var t = d.transaction(STORE, 'readwrite');
        t.objectStore(STORE).delete(id);
        t.oncomplete = function () { res(true); };
        t.onerror = function () { res(false); };
      });
    }).catch(function () { return false; });
  }

  function clear() {
    return db().then(function (d) {
      return new Promise(function (res) {
        var t = d.transaction(STORE, 'readwrite');
        t.objectStore(STORE).clear();
        t.oncomplete = function () { res(true); };
        t.onerror = function () { res(false); };
      });
    }).catch(function () { return false; });
  }

  function uid() {
    return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function pickSize(w, h, max) {
    var s = Math.min(1, max / Math.max(w || 1, h || 1));
    return { w: Math.max(1, Math.round((w || 1) * s)), h: Math.max(1, Math.round((h || 1) * s)) };
  }

  function toBlob(canvas, type, q) {
    return new Promise(function (res) { canvas.toBlob(res, type, q); });
  }

  function loadImage(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { res({ img: img, url: url }); };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('这张图打不开')); };
      img.src = url;
    });
  }

  /* 照片：最长边 1800、JPEG 0.86，够看清又够小 */
  function readPhoto(file) {
    if (file.size > 40 * 1024 * 1024) return Promise.reject(new Error('这张照片超过 40MB 了'));
    return loadImage(file).then(function (o) {
      var img = o.img;
      var size = pickSize(img.naturalWidth || img.width, img.naturalHeight || img.height, 1800);
      var c = document.createElement('canvas');
      c.width = size.w; c.height = size.h;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, size.w, size.h);
      ctx.drawImage(img, 0, 0, size.w, size.h);
      URL.revokeObjectURL(o.url);
      return toBlob(c, 'image/jpeg', 0.86).then(function (blob) {
        if (!blob) throw new Error('图片处理失败');
        return { blob: blob, w: size.w, h: size.h, type: 'image/jpeg', kind: 'photo' };
      });
    });
  }

  /* 视频：原样存本地，另外抽一张封面。
     抽不到封面不算失败 —— 视频照样存下来、照样能放，只是缩略图空着。
     手机上（尤其是 iPhone 的 HEVC .mov）canvas 经常抓不到帧，
     以前这种情况整条上传就废了，现在不会。 */
  function readVideo(file) {
    if (file.size > 500 * 1024 * 1024) return Promise.reject(new Error('这个视频超过 500MB 了，剪短一点再传'));
    var url = URL.createObjectURL(file);
    var v = document.createElement('video');
    v.preload = 'metadata';
    v.muted = true;
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');
    v.src = url;

    return new Promise(function (resolve) {
      var settled = false, captureTimer = null, metaTimer = null;
      var hardTimer = setTimeout(function () { finish(); }, 20000);

      function cleanup() {
        clearTimeout(hardTimer);
        if (captureTimer) clearTimeout(captureTimer);
        if (metaTimer) clearTimeout(metaTimer);
        try { v.removeAttribute('src'); v.load(); } catch (e) { }
        try { URL.revokeObjectURL(url); } catch (e) { }
      }
      function finish(poster) {
        if (settled) return;
        settled = true;
        cleanup();
        resolve({
          blob: file,
          kind: 'video',
          w: v.videoWidth || 0,
          h: v.videoHeight || 0,
          dur: isFinite(v.duration) ? (v.duration || 0) : 0,
          type: file.type || 'video/mp4',
          poster: poster || null
        });
      }
      function grab() {
        if (settled) return;
        var w = v.videoWidth || 0, h = v.videoHeight || 0;
        if (!w || !h) { finish(null); return; }
        var size = pickSize(w, h, 900);
        var c = document.createElement('canvas');
        c.width = size.w; c.height = size.h;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, size.w, size.h);
        try { ctx.drawImage(v, 0, 0, size.w, size.h); } catch (e) { finish(null); return; }
        toBlob(c, 'image/jpeg', 0.82).then(function (poster) {
          finish(poster && poster.size > 2000 ? poster : null);
        }, function () { finish(null); });
      }
      v.onloadedmetadata = function () {
        /* 有些文件 duration 是 Infinity，先跳一下再回来 */
        if (!isFinite(v.duration)) { try { v.currentTime = 1e101; } catch (e) { } }
        try { v.currentTime = Math.min(0.3, (isFinite(v.duration) ? v.duration : 1) * 0.2); } catch (e) { finish(null); return; }
        captureTimer = setTimeout(function () { grab(); }, 2500);
      };
      v.onseeked = function () { grab(); };
      v.onerror = function () { finish(null); };
      /* 有些容器 metadata 永远不触发，别让用户干等 */
      metaTimer = setTimeout(function () { grab(); }, 6000);
    });
  }

  PT.MEDIA = { put: put, get: get, del: del, clear: clear, uid: uid, readPhoto: readPhoto, readVideo: readVideo };
})();

</script>
<script>
/* store.js — 数据层：多只宠物、状态、持久化、日记生成、示例数据 */
(function () {
  'use strict';
  var PT = (window.PT = window.PT || {});
  var KEY = 'pawseye.diary.v1';

  var state = null;

  function defaultState() {
    return { v: 2, createdAt: new Date().toISOString(), activeId: null, pets: [], days: {}, settings: {} };
  }

  function uid() {
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* v1（单只宠物、days 是平铺的）→ v2（pets[] + days[petId]） */
  function migrate(s) {
    if (s && s.v === 2 && Array.isArray(s.pets)) {
      if (!s.days) s.days = {};
      if (!s.settings) s.settings = {};
      if (!s.activeId && s.pets[0]) s.activeId = s.pets[0].id;
      return s;
    }
    var out = defaultState();
    if (!s || typeof s !== 'object') return out;
    out.createdAt = s.createdAt || out.createdAt;
    out.settings = s.settings || {};
    if (s.pet) {
      var id = uid();
      var pet = {};
      Object.keys(s.pet).forEach(function (k) { pet[k] = s.pet[k]; });
      pet.id = id;
      if (pet.bio == null) pet.bio = '';
      out.pets = [pet];
      out.activeId = id;
      out.days[id] = s.days || {};
    }
    return out;
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) state = migrate(JSON.parse(raw));
    } catch (e) { /* 忽略损坏数据 */ }
    if (!state) state = defaultState();
    return state;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {
      console.warn('保存失败（可能是本地存储已满）', e);
    }
  }

  function setting(k, def) {
    var st = get();
    if (!st.settings) st.settings = {};
    return st.settings[k] === undefined ? def : st.settings[k];
  }

  function setSetting(k, v) {
    var st = get();
    if (!st.settings) st.settings = {};
    st.settings[k] = v;
    save();
  }

  function get() {
    if (!state) load();
    if (PT.setExtraBreeds) PT.setExtraBreeds(state.customBreeds || []);
    return state;
  }

  /* ---------------- 宠物 ---------------- */

  function pets() { return get().pets || []; }

  function petById(id) {
    return pets().filter(function (p) { return p.id === id; })[0] || null;
  }

  function active() {
    var s = get();
    return petById(s.activeId) || pets()[0] || null;
  }

  function activeId() {
    var p = active();
    return p ? p.id : null;
  }

  function setActive(id) {
    if (!petById(id)) return;
    get().activeId = id;
    save();
  }

  function addPet(pet) {
    var s = get();
    var p = { bio: '' };
    Object.keys(pet || {}).forEach(function (k) { if (k !== 'id') p[k] = pet[k]; });
    p.id = uid();
    p.createdAt = p.createdAt || new Date().toISOString();
    s.pets.push(p);
    if (!s.days[p.id]) s.days[p.id] = {};
    s.activeId = p.id;
    save();
    return p;
  }

  function updatePet(id, patch) {
    var p = petById(id);
    if (!p) return null;
    Object.keys(patch || {}).forEach(function (k) { if (k !== 'id') p[k] = patch[k]; });
    save();
    return p;
  }

  function removePet(id) {
    var s = get();
    if (s.pets.length <= 1) return false;
    s.pets = s.pets.filter(function (p) { return p.id !== id; });
    delete s.days[id];
    if (s.activeId === id) s.activeId = s.pets[0].id;
    save();
    return true;
  }

  function setPet(pet) {
    var a = active();
    if (a) return updatePet(a.id, pet);
    return addPet(pet);
  }

  /* ---------------- 重要节点（档案用） ---------------- */

  function milestones(petId) {
    var p = petById(petId || activeId());
    if (!p) return [];
    if (!p.milestones) p.milestones = [];
    return p.milestones.slice().sort(function (a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    });
  }

  function addMilestone(date, label, icon) {
    var p = active();
    if (!p) return null;
    if (!p.milestones) p.milestones = [];
    var m = { id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: date, label: String(label || '').slice(0, 14), icon: icon || '⭐️' };
    p.milestones.push(m);
    save();
    return m;
  }

  function removeMilestone(id) {
    var p = active();
    if (!p || !p.milestones) return false;
    var n = p.milestones.length;
    p.milestones = p.milestones.filter(function (m) { return m.id !== id; });
    if (p.milestones.length === n) return false;
    save();
    return true;
  }

  /* ---------------- 自己加的品种 ---------------- */

  function customBreeds(species) {
    var list = (get().customBreeds || []).slice();
    if (!species) return list;
    var sp = species === 'dog' ? 'dog' : 'cat';
    return list.filter(function (b) { return b.species === sp; });
  }

  function addBreed(patch) {
    var p = patch || {};
    var sp = p.species === 'dog' ? 'dog' : 'cat';
    var label = String(p.label || '').trim().slice(0, 8);
    if (!label) return null;
    var s = get();
    if (!s.customBreeds) s.customBreeds = [];
    if (s.customBreeds.some(function (x) { return x.species === sp && x.label === label; })) return null;
    var b = {
      id: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      species: sp,
      label: label,
      fur: p.fur || '#E9D2B0',
      furD: p.furD || '#B2936A',
      eye: p.eye || '',
      pattern: p.pattern || '',
      ears: sp === 'dog' ? (p.ears || 'flop') : ''
    };
    s.customBreeds.push(b);
    save();
    syncExtras();
    return b;
  }

  function removeBreed(id) {
    var s = get();
    if (!s.customBreeds) return false;
    var n = s.customBreeds.length;
    s.customBreeds = s.customBreeds.filter(function (b) { return b.id !== id; });
    if (s.customBreeds.length === n) return false;
    save();
    syncExtras();
    return true;
  }

  function syncExtras() {
    if (PT.setExtraBreeds) PT.setExtraBreeds(get().customBreeds || []);
  }

  /* ---------------- 档案里的自定义字段（芯片号、血型…） ---------------- */

  function fields(petId) {
    var p = petById(petId || activeId());
    return p && p.fields ? p.fields.slice() : [];
  }

  function addField(petId, label, value) {
    var p = petById(petId || activeId());
    if (!p) return null;
    if (!p.fields) p.fields = [];
    var f = {
      id: 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      label: String(label || '').trim().slice(0, 12),
      value: String(value == null ? '' : value).trim().slice(0, 60)
    };
    if (!f.label) return null;
    p.fields.push(f);
    save();
    return f;
  }

  function updateField(petId, id, patch) {
    var p = petById(petId || activeId());
    if (!p || !p.fields) return null;
    var f = p.fields.filter(function (x) { return x.id === id; })[0];
    if (!f) return null;
    if (patch.label != null) f.label = String(patch.label).trim().slice(0, 12);
    if (patch.value != null) f.value = String(patch.value).trim().slice(0, 60);
    save();
    return f;
  }

  function removeField(petId, id) {
    var p = petById(petId || activeId());
    if (!p || !p.fields) return false;
    var n = p.fields.length;
    p.fields = p.fields.filter(function (x) { return x.id !== id; });
    if (p.fields.length === n) return false;
    save();
    return true;
  }

  /* ---------------- 每天 ---------------- */

  function bucket(petId) {
    var s = get();
    if (!s.days) s.days = {};
    if (!s.days[petId]) s.days[petId] = {};
    return s.days[petId];
  }

  function day(key, petId) {
    var s = get();
    var b = s.days[petId || activeId()];
    return (b && b[key]) || null;
  }

  function ensureDay(key, petId) {
    var b = bucket(petId || activeId());
    if (!b[key]) b[key] = { date: key, events: [], note: '', diary: null };
    var d = b[key];
    if (!d.events) d.events = [];
    if (d.note == null) d.note = '';
    return d;
  }

  function addEvent(key, type, opts) {
    opts = opts || {};
    var d = ensureDay(key);
    var t = PT.TYPE[type];
    var custom = !t ? customType(type) : null;
    if (!t && !custom) return null;
    var ev = { id: uid(), type: type, at: Date.now() };
    if (t && t.num) ev.num = opts.num != null ? opts.num : t.num.def;
    if (t && t.opt) ev.opt = opts.opt || t.opt[0];
    if (custom) ev.label = custom.label;
    d.events.push(ev);
    if (d.diary) d.diary.stale = true;
    save();
    return ev;
  }

  /* ---------------- 自定义事件类型 ---------------- */

  function customTypes() {
    return get().customTypes || [];
  }

  function customType(id) {
    var list = customTypes();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function addCustomType(label, icon) {
    label = String(label || '').trim().slice(0, 8);
    if (!label) return null;
    var s = get();
    if (!s.customTypes) s.customTypes = [];
    var dup = s.customTypes.filter(function (t) { return t.label === label; })[0];
    if (dup) return dup;
    var t = { id: 'x' + uid(), label: label, icon: String(icon || '⭐️') };
    s.customTypes.push(t);
    save();
    return t;
  }

  function removeCustomType(id) {
    var s = get();
    if (!s.customTypes) return;
    s.customTypes = s.customTypes.filter(function (t) { return t.id !== id; });
    save();
  }

  function updateEvent(key, id, patch) {
    var d = day(key);
    if (!d) return;
    var ev = d.events.filter(function (e) { return e.id === id; })[0];
    if (!ev) return;
    Object.keys(patch).forEach(function (k) { ev[k] = patch[k]; });
    if (d.diary) d.diary.stale = true;
    save();
  }

  function removeEvent(key, id) {
    var d = day(key);
    if (!d) return;
    d.events = d.events.filter(function (e) { return e.id !== id; });
    if (d.diary) d.diary.stale = true;
    save();
  }

  function setNote(key, note) {
    var d = ensureDay(key);
    d.note = note || '';
    if (d.diary) d.diary.stale = true;
    save();
  }

  function addMedia(key, meta) {
    var d = ensureDay(key);
    d.media = d.media || [];
    d.media.push(meta);
    save();
    return d.media;
  }

  function removeMedia(key, id) {
    var d = day(key);
    if (!d || !d.media) return;
    d.media = d.media.filter(function (m) { return m.id !== id; });
    save();
  }

  function mediaOf(key) {
    var d = day(key);
    return (d && d.media) || [];
  }

  function historyHashes(petId, limit) {
    var s = get();
    var b = s.days[petId || activeId()] || {};
    var out = [];
    var keys = Object.keys(b).sort().reverse();
    for (var i = 0; i < keys.length && out.length < (limit || 160); i++) {
      var d = b[keys[i]];
      if (d.diary && d.diary.used) out = out.concat(d.diary.used);
    }
    return out.slice(0, limit || 160);
  }

  function generateFor(petId, key, reroll) {
    var pet = petById(petId);
    if (!pet) return null;
    var d = ensureDay(key, petId);
    var diary = PT.WRITER.generate({
      pet: pet,
      date: key,
      events: d.events,
      note: d.note,
      media: d.media || [],
      reroll: reroll || 0,
      history: historyHashes(petId, 160)
    });
    diary.createdAt = new Date().toISOString();
    diary.stale = false;
    d.diary = diary;
    save();
    return diary;
  }

  function generate(key, reroll) {
    return generateFor(activeId(), key, reroll);
  }

  function clearDiary(key) {
    var d = day(key);
    if (!d) return;
    d.diary = null;
    save();
  }

  function allDays(petId) {
    var s = get();
    var b = s.days[petId || activeId()] || {};
    var out = [];
    Object.keys(b).forEach(function (k) {
      var d = b[k];
      if ((d.events && d.events.length) || d.diary) out.push(d);
    });
    return out.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }

  function stats(petId) {
    var s = get();
    var id = petId || activeId();
    var days = allDays(id);
    var withDiary = days.filter(function (d) { return d.diary; });
    var pet = petById(id) || {};
    var start = pet.homeDate || pet.birthday || (s.createdAt || '').slice(0, 10);
    var together = start ? PT.daysBetween(start, PT.todayKey()) + 1 : 0;
    var first = days.length ? days[days.length - 1].date : null;
    return {
      together: Math.max(1, together),
      recordedDays: days.filter(function (d) { return d.events && d.events.length; }).length,
      diaryCount: withDiary.length,
      firstDate: first,
      lastDate: days.length ? days[0].date : null
    };
  }

  function weights(petId) {
    var out = [];
    allDays(petId).slice().reverse().forEach(function (d) {
      (d.events || []).forEach(function (e) {
        if (e.type === 'weight' && e.num != null) out.push({ date: d.date, kg: Number(e.num) });
      });
    });
    return out;
  }

  function exportJSON() { return JSON.stringify(get(), null, 2); }

  function importJSON(text) {
    var s = migrate(JSON.parse(text));
    /* 备份里没有图片视频的字节，别把空壳位置带进来 */
    Object.keys(s.days).forEach(function (pid) {
      Object.keys(s.days[pid] || {}).forEach(function (k) {
        if (s.days[pid][k]) delete s.days[pid][k].media;
      });
    });
    state = s;
    save();
    return true;
  }

  function reset() {
    state = defaultState();
    save();
  }

  /* ---------------- 示例数据 ---------------- */

  function agoKey(n) {
    var d = new Date();
    d.setDate(d.getDate() - n);
    return PT.keyOf(d);
  }

  function seedDemo() {
    state = defaultState();
    var todayKey = agoKey(0);

    var mao = addPet({
      name: '麻薯',
      species: 'cat',
      breed: '中华田园猫',
      breedId: 'orange',
      personality: 'tsundere',
      bio: '三岁半的橘猫。怕生，只认纸箱和你刚坐热的那把椅子。',
      birthday: agoKey(1280),
      homeDate: agoKey(560)
    });
    var gao = addPet({
      name: '年糕',
      species: 'dog',
      breed: '柴犬',
      breedId: 'shiba',
      personality: 'clingy',
      bio: '两岁的柴犬。谁开门都当是自己的朋友，包括快递员。',
      birthday: agoKey(730),
      homeDate: agoKey(210)
    });

    var maoScript = [
      { d: 1, ev: ['meal', 'poop', 'cuddle'] },
      { d: 2, ev: ['walk', 'play', 'meal'] },
      { d: 3, ev: ['vomit', 'vet', 'med'], note: '吐了两次，明天还是带去看看吧' },
      { d: 5, ev: ['bath', 'weight', 'meal'] },
      { d: 7, ev: ['walk', 'play', 'poop'] },
      { d: 9, ev: ['meal', 'water', 'sleep'] },
      { d: 12, ev: ['naughty', 'meal', 'cuddle'], note: '今天把我杯子推下去了，还看着我' },
      { d: 0, ev: ['meal', 'walk'] }
    ];
    var gaoScript = [
      { d: 1, ev: ['walk', 'poop', 'play'], note: '在小区门口坐着不肯走' },
      { d: 4, ev: ['vaccine', 'weight', 'meal'] },
      { d: 6, ev: ['bath', 'walk'] },
      { d: 10, ev: ['vet', 'med'], note: '打针，全程没叫，回来蔫了一下午' },
      { d: 0, ev: ['walk', 'cuddle'] }
    ];
    var defaults = { meal: 45, walk: 30, weight: 4.3, water: 120 };
    var gaoDefaults = { meal: 110, walk: 40, weight: 9.6, water: 300 };

    function fill(pet, script, defs) {
      script.forEach(function (row) {
        var key = agoKey(row.d);
        var d = ensureDay(key, pet.id);
        row.ev.forEach(function (type) {
          var t = PT.TYPE[type];
          if (!t) return;
          var ev = { id: uid(), type: type, at: Date.now() };
          if (t.num) ev.num = defs[type] != null ? defs[type] : t.num.def;
          if (t.opt) ev.opt = t.opt[0];
          d.events.push(ev);
        });
        if (row.note) d.note = row.note;
      });
      // 按日期顺序生成，模拟真实书写轨迹；今天留白，等你自己点「让它写今天的日记」
      Object.keys(state.days[pet.id]).sort().forEach(function (k) {
        var d = state.days[pet.id][k];
        if (d.events.length && k !== todayKey) generateFor(pet.id, k, 0);
      });
    }

    fill(mao, maoScript, defaults);
    fill(gao, gaoScript, gaoDefaults);

    /* 一条自定义事件：主人自己加的「剪指甲」 */
    var ct = addCustomType('剪指甲', '✂️');
    if (ct) {
      var ck = agoKey(7);
      var cd = ensureDay(ck, mao.id);
      cd.events.push({ id: uid(), type: ct.id, label: ct.label, at: Date.now() });
      generateFor(mao.id, ck, 0);
    }

    state.activeId = mao.id;
    /* 档案里手记的两个重要节点：绝育手术、一次疫苗 */
    mao.milestones = [
      { id: 'm' + uid(), date: agoKey(300), label: '绝育手术', icon: '🏥' },
      { id: 'm' + uid(), date: agoKey(150), label: '搬家到新家', icon: '🏠' }
    ];
    var vk = agoKey(48);
    var vd = ensureDay(vk, mao.id);
    vd.events.push({ id: uid(), type: 'vaccine', at: Date.now() });
    generateFor(mao.id, vk, 0);
    save();
    save();
  }

  PT.STORE = {
    customBreeds: customBreeds, addBreed: addBreed, removeBreed: removeBreed,
    setting: setting, setSetting: setSetting,
    load: load, save: save, get: get,
    pets: pets, active: active, setActive: setActive, addPet: addPet, updatePet: updatePet,
    removePet: removePet, petById: petById, setPet: setPet,
    day: day, ensureDay: ensureDay,
    addEvent: addEvent, updateEvent: updateEvent, removeEvent: removeEvent, setNote: setNote,
    customTypes: customTypes, customType: customType, addCustomType: addCustomType, removeCustomType: removeCustomType,
    milestones: milestones, addMilestone: addMilestone, removeMilestone: removeMilestone,
    fields: fields, addField: addField, updateField: updateField, removeField: removeField,
    addMedia: addMedia, removeMedia: removeMedia, mediaOf: mediaOf,
    generate: generate, generateFor: generateFor, clearDiary: clearDiary, historyHashes: historyHashes,
    allDays: allDays, stats: stats, weights: weights,
    exportJSON: exportJSON, importJSON: importJSON, reset: reset, seedDemo: seedDemo,
    uid: uid, KEY: KEY
  };
})();

</script>
<script>
/* app.js — 界面与交互 */
(function () {
  'use strict';
  var PT = window.PT, S = PT.STORE;
  var $app = document.getElementById('app');
  var esc = PT.escape;

  var view = { name: 'today', key: null };
  var writing = null;
  var toastTimer = null;

  var PERSON = [
    { id: 'tsundere', label: '傲娇', desc: '嘴上不在乎，行动很诚实' },
    { id: 'clingy', label: '黏人', desc: '你去哪，它就去哪' },
    { id: 'aloof', label: '高冷', desc: '允许你待在附近' },
    { id: 'greedy', label: '贪吃', desc: '心里只有开饭的声音' },
    { id: 'curious', label: '好奇', desc: '所有柜子都要检查一遍' }
  ];

  /* ---------------- 小工具 ---------------- */

  function dayNo(key) {
    var pet = S.active() || {};
    var start = pet.homeDate || pet.birthday || (S.get().createdAt || '').slice(0, 10);
    if (!start) return 1;
    return Math.max(1, PT.daysBetween(start, key) + 1);
  }

  function moodObj(k) { return PT.MOODS[k] || PT.MOODS.calm; }

  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1600);
  }

  function paragraphs(body, animate) {
    return String(body || '').split('\n').filter(Boolean).map(function (p, i) {
      var st = animate ? ' style="animation-delay:' + (i * 110) + 'ms"' : '';
      return '<p class="para"' + st + '>' + esc(p) + '</p>';
    }).join('');
  }

  function factsHTML(d) {
    var items = (d.events || []).map(function (e) {
      var t = typeInfo(e);
      var extra = '';
      if (e.num != null) extra = ' ' + e.num + (t.num ? t.num.unit : '');
      if (e.opt) extra = ' ' + e.opt;
      return '<span class="fact">' + esc(t.icon) + ' ' + esc(t.label) + esc(extra) + '</span>';
    }).join('');
    var note = d.note ? '<div class="fact-note">你写下：' + esc(d.note) + '</div>' : '';
    return '<div class="fact-list">' + (items || '<span class="fact dim">没有留下事实</span>') + '</div>' + note;
  }

  function entryCard(key, opts) {
    opts = opts || {};
    var d = S.day(key);
    if (!d || !d.diary) return '';
    var mo = moodObj(d.diary.mood);
    var body = paragraphs(d.diary.body, opts.animate);
    return '' +
      '<article class="entry card" id="entry-' + key + '">' +
      '<div class="entry-top">' +
      '<span class="entry-day">' + PT.fmtShort(key) + ' · 第 ' + dayNo(key) + ' 天</span>' +
      '<span class="mood" style="color:' + mo.color + ';border-color:' + mo.color + '33">' + mo.emoji + ' ' + mo.label + '</span>' +
      '</div>' +
      '<h2 class="entry-title">' + esc(d.diary.title) + '</h2>' +
      '<div class="entry-body">' + body + '</div>' +
      mediaGrid(key) +
      (d.diary.stale ? '<div class="stale">这一天的事实后来改过，这篇是当时的版本。</div>' : '') +
      '<details class="facts"><summary>那天的事实</summary>' + factsHTML(d) + '</details>' +
      (opts.hideActions ? '' :
        '<div class="entry-actions">' +
        '<button class="mini" data-act="reroll" data-key="' + key + '">重写</button>' +
        '<button class="mini" data-act="share" data-key="' + key + '">存成图片</button>' +
        (d.diary ? '<button class="mini ghost" data-act="cleardiary" data-key="' + key + '">删掉这篇</button>' : '') +
        '</div>') +
      '</article>';
  }

  /* ---------------- 照片 / 视频 ---------------- */

  var objUrls = [];
  var urlCache = {};

  function posterId(m) {
    if (m.kind !== 'video') return m.id;
    return m.hasPoster ? m.id + '-p' : '';
  }

  function mediaStrip(key) {
    var media = S.mediaOf(key);
    var tiles = media.map(function (m) {
      var pid = posterId(m);
      return '<div class="mtile' + (m.kind === 'video' ? ' vid' : '') + '" data-act="media-open" data-mid="' + m.id + '">' +
        (pid ? '<img data-mid="' + pid + '" alt="">' : '<span class="mblank">视频</span>') +
        (m.kind === 'video' ? '<span class="mplay"></span>' : '') +
        '<button class="mtile-x" data-act="media-del" data-mid="' + m.id + '" data-key="' + key + '" aria-label="删除">×</button>' +
        '</div>';
    }).join('');
    return '<div class="mstrip">' + tiles +
      '<div class="madds">' +
      '<button class="madd" data-act="pick-photo" data-key="' + key + '"><span>＋</span>照片</button>' +
      '<button class="madd" data-act="pick-video" data-key="' + key + '"><span>＋</span>视频</button>' +
      '</div></div>' +
      (media.length ? '<div class="mtip">点开看原图；长视频建议剪短再传，它只存在这台设备上。</div>' : '') +
      '<input type="file" class="mfile" id="file-photo" data-key="' + key + '" accept="image/*" multiple hidden>' +
      '<input type="file" class="mfile" id="file-video" data-key="' + key + '" accept="video/*" multiple hidden>';
  }

  function mediaGrid(key) {
    var media = S.mediaOf(key);
    if (!media.length) return '';
    var cells = media.map(function (m) {
      var pid = posterId(m);
      return '<div class="mcell' + (m.kind === 'video' ? ' vid' : '') + '" data-act="media-open" data-mid="' + m.id + '">' +
        (pid ? '<img data-mid="' + pid + '" alt="">' : '<span class="mblank">视频</span>') +
        (m.kind === 'video' ? '<span class="mplay"></span>' : '') +
        '</div>';
    }).join('');
    return '<div class="mgrid n' + Math.min(media.length, 4) + '">' + cells + '</div>';
  }

  /* 把 IndexedDB 里的字节贴回 <img> 上（objectURL 每次渲染重建） */
  function hydrateMedia() {
    objUrls.forEach(function (u) { URL.revokeObjectURL(u); });
    objUrls = [];
    urlCache = {};
    var imgs = document.querySelectorAll('img[data-mid]');
    Array.prototype.forEach.call(imgs, function (img) {
      var id = img.getAttribute('data-mid');
      if (!id) return;
      if (urlCache[id]) { img.src = urlCache[id]; return; }
      PT.MEDIA.get(id).then(function (blob) {
        if (!blob) { img.classList.add('muted'); img.alt = '文件已丢失'; return; }
        var url = URL.createObjectURL(blob);
        urlCache[id] = url;
        objUrls.push(url);
        if (img.isConnected) img.src = url;
      });
    });
  }

  /* 头像：有照片用照片，没有就用画的那张 */
  function faceOf(pet, mood, opts) {
    if (pet && pet.photo) {
      return '<img class="face-photo" src="' + pet.photo + '" alt="">';
    }
    return PT.ART.face(pet.species, mood, opts || {});
  }

  /* 把选中的图片缩成 320×320 的方图，存成 dataURL（不放 IndexedDB，换设备导出时一起带走） */
  function shrinkAvatar(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var S0 = 320;
          var w = img.naturalWidth, h = img.naturalHeight;
          var side = Math.min(w, h);
          var cv = document.createElement('canvas');
          cv.width = S0; cv.height = S0;
          var g = cv.getContext('2d');
          g.drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, S0, S0);
          URL.revokeObjectURL(url);
          resolve(cv.toDataURL('image/jpeg', 0.84));
        } catch (e) { URL.revokeObjectURL(url); reject(e); }
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('这张图打不开')); };
      img.src = url;
    });
  }

  /* 备份码：整份数据压缩 + base64，方便复制粘贴到另一台设备
     1: 开头是 deflate 压缩过的，0: 开头是没压缩的老格式 */
  function b64FromBytes(bytes) {
    var bin = '', step = 0x8000;
    for (var i = 0; i < bytes.length; i += step) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    }
    return btoa(bin);
  }

  function bytesFromB64(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function codeFromJson(json) {
    var bytes = new TextEncoder().encode(json);
    if (window.CompressionStream) {
      return new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw')))
        .arrayBuffer()
        .then(function (buf) { return '1:' + b64FromBytes(new Uint8Array(buf)); });
    }
    return Promise.resolve('0:' + btoa(unescape(encodeURIComponent(json))));
  }

  function jsonFromCode(code) {
    var raw = String(code || '').trim().replace(/\s+/g, '');
    if (raw.indexOf('1:') === 0) {
      if (!window.DecompressionStream) return Promise.reject(new Error('这个浏览器不支持'));
      var bytes = bytesFromB64(raw.slice(2));
      return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')))
        .arrayBuffer()
        .then(function (buf) { return new TextDecoder().decode(new Uint8Array(buf)); });
    }
    var plain = raw.indexOf('0:') === 0 ? raw.slice(2) : raw;
    return Promise.resolve(decodeURIComponent(escape(atob(plain))));
  }

  function openCodeSheet() {

    ov.className = 'sheetwrap';
    ov.innerHTML =

      '<textarea id="code-in" class="input note" rows="6" placeholder="粘贴备份码…"></textarea>' +
      '<div class="avs-btns" style="margin-top:14px"><button class="mini accent" data-code="go">恢复</button></div>' +
      '</div>';
    var ta = ov.querySelector('#code-in');

  function copyCode() {
    codeFromJson(S.exportJSON()).then(function (code) {
      var done = function (ok) {
        toast(ok ? '备份码已复制（' + code.length + ' 个字），粘到新手机就能恢复'
                 : '复制不了，码有 ' + code.length + ' 个字，可以手动全选复制');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(function () { done(true); }, function () { done(false); });
        return;
      }
      var ta = document.createElement('textarea');
      ta.value = code;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(true); } catch (e) { done(false); }
      ta.remove();
    }).catch(function () { toast('这台设备上生成不了备份码'); });
  }

  function openMedia(mid) {    PT.MEDIA.get(mid).then(function (blob) {
      if (!blob) { toast('这个文件已经找不到了'); return; }
      var url = URL.createObjectURL(blob);
      var meta = null;
      Object.keys(S.get().days).forEach(function (pid) {
        Object.keys(S.get().days[pid] || {}).forEach(function (k) {
          var d = S.get().days[pid][k];
          (d && d.media ? d.media : []).forEach(function (m) { if (m.id === mid) meta = m; });
        });
      });
      var isVideo = meta ? meta.kind === 'video' : (blob.type || '').indexOf('video') === 0;
      var lb = document.createElement('div');
      lb.className = 'lb';
      lb.innerHTML = (isVideo
        ? '<video src="' + url + '" controls autoplay playsinline></video>'
        : '<img src="' + url + '" alt="">') +
        '<button class="lb-x" aria-label="关闭">×</button>';
      lb.addEventListener('click', function (ev) {
        if (ev.target === lb || ev.target.classList.contains('lb-x')) {
          if (isVideo) { var v = lb.querySelector('video'); if (v) v.pause(); }
          URL.revokeObjectURL(url);
          lb.remove();
        }
      });
      document.body.appendChild(lb);
    });
  }

  function ingest(files, kind, key) {
    var list = [].slice.call(files || []);
    if (!list.length) return;
    var ok = 0;
    toast(kind === 'photo' ? '正在处理照片…' : '正在读视频，稍等…');
    var chain = Promise.resolve();
    list.forEach(function (f) {
      chain = chain.then(function () {
        var p = kind === 'photo' ? PT.MEDIA.readPhoto(f) : PT.MEDIA.readVideo(f);
        return p.then(function (r) {
          var id = PT.MEDIA.uid();
          var meta = { id: id, kind: r.kind, w: r.w, h: r.h, dur: r.dur || 0, type: r.type, hasPoster: !!r.poster };
          return PT.MEDIA.put(id, r.blob).then(function () {
            if (r.poster) return PT.MEDIA.put(id + '-p', r.poster);
          }).then(function () {
            S.addMedia(key, meta);
            ok++;
          });
        }).catch(function (err) {
          toast((err && err.message) || '这个文件处理不了');
        });
      });
    });
    chain.then(function () {
      render({});
      if (ok) toast(ok + ' 个' + (kind === 'photo' ? '照片' : '视频') + '存好了');
    });
  }

  /* ---------------- 引导 ---------------- */

  var ob = { species: 'cat', breedId: 'orange', personality: 'tsundere', ptext: '', editing: false, mode: 'first', draft: null, photo: '' };

  /* 表单重渲染前先收一遍已输入的内容，别让用户白打 */

  function harvestMs() {
    var l = document.getElementById('ms-label');
    var d = document.getElementById('ms-date');

    if (d) ms.date = d.value;

    var n = document.getElementById('ob-name');
    var b = document.getElementById('ob-bio');

    ob.draft = {

  function breedOfSpecies(sp, id) {
    var b = PT.breedById(sp, id);
    if (b) return b;
    return (PT.BREEDS[sp === 'dog' ? 'dog' : 'cat'] || [])[0] || null;
  }

  function renderOnboarding() {
    var prev = ob.editing ? S.active() : null;
    var adding = ob.mode === 'new';
    /* 只在「第一次进入这个表单」时用现有资料铺底，之后以用户的选择为准 */
    if (prev && ob.seedFor !== prev.id) {
      ob.seedFor = prev.id;
      ob.species = prev.species === 'dog' ? 'dog' : 'cat';
      ob.personality = prev.personality || 'tsundere';
      ob.ptext = prev.personalityText || '';
      if (prev.breedId) ob.breedId = prev.breedId;
      ob.photo = prev.photo || '';
      ob.draft = null;
    }
    if (!prev) ob.seedFor = '';
    var breed = breedOfSpecies(ob.species, ob.breedId);

    var hero = ob.photo
      ? '<img class="face-photo" src="' + ob.photo + '" alt="">'
      : PT.ART.face(ob.species, 'calm', { tilt: -2, breed: breed });
    var dval = function (k, fallback) {

    var breeds = PT.breedList(ob.species).map(function (b) {
      return '<button class="breed' + (ob.breedId === b.id ? ' on' : '') + '" data-act="ob-breed" data-id="' + b.id + '">' +
        (b.custom ? '<span class="bdel" data-act="breed-del" data-id="' + b.id + '" aria-label="删掉">×</span>' : '') +
        '<span class="bd-face">' + PT.ART.face(ob.species, 'calm', { tilt: 0, breed: b }) + '</span>' +

  function chipIds() {

  }

  function saveChips(ids) { S.setSetting('chips', ids); }

  function chipMeta(id) {
    var t = PT.TYPE[id];
    if (t) return { id: id, label: t.label, icon: t.icon, mine: false };
    var c = S.customType(id);
    return c ? { id: id, label: c.label, icon: c.icon, mine: true } : null;

    var html = chipIds().map(function (id) {
      var m = chipMeta(id);

      return '<button class="chip' + (m.mine ? ' mine' : '') + (chips.edit ? ' editing' : '') + '" data-act="add" data-id="' + id + '">' +

      html += '<button class="chip add' + (composer.open ? ' on' : '') + '" data-act="composer"><span class="ci">＋</span>自定义</button>';

    }

      '<section class="block">' +

      '<div class="evs">' + evs + '</div>' +
      '<textarea class="note" id="note" data-key="' + key + '" rows="2" maxlength="60" placeholder="想补一句就写在这儿（选填）">' + esc(d ? d.note : '') + '</textarea>' +

  /* ---------------- 日记本 ---------------- */

  function renderDiary() {
    var days = S.allDays().filter(function (d) { return d.diary; });
    if (!days.length) {
      return '' +
        petSwitcher() +
        '<header class="head"><div class="kicker">日记本</div><h1 class="page-title">还没有一页</h1></header>' +
        '<div class="empty card">' + PT.ART.paw(48, '#D8CBB6') +
        '<p>回到今天，记两笔。<br>它会替你写下来。</p>' +
        '<button class="mini" data-act="tab" data-id="today">去记一笔</button></div>';
    }
    var groups = [];
    var cur = null;
    days.forEach(function (d) {
      var m = d.date.slice(0, 7);
      if (!cur || cur.m !== m) { cur = { m: m, items: [] }; groups.push(cur); }
      cur.items.push(d);
    });
    var html = groups.map(function (g) {
      var y = g.m.slice(0, 4), mo = Number(g.m.slice(5, 7));
      var rows = g.items.map(function (d) {
        var mo2 = moodObj(d.diary.mood);
        var ex = d.diary.body.split('\n')[0] || '';
        if (ex.length > 26) ex = ex.slice(0, 26) + '…';
        return '<a class="row" data-act="entry" data-key="' + d.date + '">' +
          '<div class="row-date"><b>' + Number(d.date.slice(8, 10)) + '</b><span>周' + PT.weekShort[PT.parseDate(d.date).getDay()] + '</span></div>' +
          '<div class="row-main"><div class="row-title">' + esc(d.diary.title) + '</div><div class="row-ex">' + esc(ex) + '</div></div>' +
          '<div class="row-dot" style="background:' + mo2.color + '"></div>' +
          '</a>';
      }).join('');
      return '<div class="month"><div class="month-label">' + y + ' 年 ' + mo + ' 月</div>' + rows + '</div>';
    }).join('');

    var total = days.length;

      '<header class="head"><div class="kicker">日记本</div><h1 class="page-title">它写的 ' + total + ' 篇</h1>' +
      '<p class="sub">从 ' + PT.fmtShort(days[days.length - 1].date) + ' 到现在</p></header>' +
      html +
      '<p class="list-foot">' + PT.ART.paw(13, '#C9BBA5') + ' 它还在写</p>';

  /* ---------------- 它 ---------------- */

  function sparkline(pts) {
    if (!pts.length) return '<div class="dim small">还没称过。记两次以上就能看到曲线。</div>';
    if (pts.length === 1) {
      return '<div class="chart"><div class="chart-meta big"><span>' + pts[0].kg + ' kg</span><span>' + PT.fmtShort(pts[0].date) + ' · 再记一次就有曲线</span></div></div>';
    }
    var W = 280, H = 70, pad = 8;
    var vals = pts.map(function (p) { return p.kg; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = max - min || 1;
    var step = (W - pad * 2) / (pts.length - 1);
    var path = pts.map(function (p, i) {
      var x = pad + step * i;
      var y = pad + (H - pad * 2) * (1 - (p.kg - min) / span);
      return (i ? 'L' : 'M') + (Math.round(x * 10) / 10) + ' ' + (Math.round(y * 10) / 10);
    }).join(' ');
    var last = pts[pts.length - 1], first = pts[0];
    return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<path d="' + path + '" fill="none" stroke="#C2613F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg><div class="chart-meta"><span>' + first.kg + ' kg · ' + PT.fmtShort(first.date) + '</span><span>' + last.kg + ' kg · ' + PT.fmtShort(last.date) + '</span></div></div>';
  }

  function petRow(p, isOn) {
    return '<button class="petrow' + (isOn ? ' on' : '') + '" data-act="switch-pet" data-id="' + p.id + '">' +
      '<span class="pr-face">' + faceOf(p, isOn ? 'happy' : 'calm', { tilt: 0, breed: PT.breedOf(p) }) + '</span>' +
      '<span class="pr-main"><b>' + esc(p.name) + '</b><i>' + esc(p.bio || (p.species === 'dog' ? '一只狗' : '一只猫')) + '</i></span>' +
      (isOn ? '<span class="pr-on">现在看的是它</span>' : '') +
      '</button>';
  }

  /* 健康档案：洗澡、看病、疫苗、驱虫、吃药、吐，按时间倒序 */
  function healthTimeline(pet) {
    var rows = [];
    S.allDays(pet.id).forEach(function (d) {
      (d.events || []).forEach(function (e) {
        if (PT.HEALTH.indexOf(e.type) < 0) return;
        rows.push({ date: d.date, e: e, at: e.at || 0 });
      });
    });
    rows.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : b.at - a.at; });
    if (!rows.length) {
      return '<div class="dim small">还没有记录。洗澡、看医生、打疫苗、驱虫都会自动记在这里。</div>';
    }
    var shown = rows.slice(0, 12);
    return '<ul class="health">' + shown.map(function (r) {
      var t = typeInfo(r.e);
      var extra = r.e.opt ? ' · ' + r.e.opt : '';
      var since = PT.daysBetween(r.date, PT.todayKey());
      return '<li><span class="hl-ic">' + esc(t.icon) + '</span>' +
        '<span class="hl-main"><b>' + esc(t.label) + esc(extra) + '</b>' +
        '<i>' + PT.fmtShort(r.date) + (since > 0 ? ' · ' + since + ' 天前' : ' · 今天') + '</i></span></li>';
    }).join('') + '</ul>' +
      (rows.length > shown.length ? '<p class="dim small">还有 ' + (rows.length - shown.length) + ' 条更早的。</p>' : '');
  }

  function renderPet() {

    var w = S.weights();
    var all = S.pets();

      '<div class="block"><div class="sec-title">档案 <span class="dim">体重 / 疫苗 / 重要节点都在「档案」里</span></div><div class="card pad">' +
      '<div class="kv"><span>品种</span><b>' + esc(PT.breedLabel(pet) || '没填') + '</b></div>' +
