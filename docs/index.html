<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EEE3">
<meta name="description" content="它眼里的世界 — 你只记事实，它来写日记。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="它的世界">
<meta name="mobile-web-app-capable" content="yes">
<title>它眼里的世界</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='20' cy='18' rx='6' ry='7.5' fill='%233A322C'/%3E%3Cellipse cx='32' cy='13' rx='5.6' ry='7' fill='%233A322C'/%3E%3Cellipse cx='44' cy='18' rx='6' ry='7.5' fill='%233A322C'/%3E%3Cellipse cx='52' cy='30' rx='5' ry='6' fill='%233A322C'/%3E%3Cpath d='M32 26c9 0 16 8 16 15 0 6-5 9-10 9-3 0-4-1-6-1s-3 1-6 1c-5 0-10-3-10-9 0-7 7-15 16-15z' fill='%23C2613F'/%3E%3C/svg%3E">
<style>
/* styles.css — 纸张、字、一点点手绘 */
:root {
  --sh: 58, 50, 44;
  --accent-rgb: 194, 97, 63;
  --bg: #E9DFCE;
  --bg-glow: var(--paper-2);
  --bg-2: #E2D5BF;
  --paper: var(--paper);
  --paper-2: var(--paper-2);
  --paper-3: var(--paper-3);
  --ink: var(--ink);
  --ink-soft: var(--ink-soft);
  --muted: var(--muted);
  --line: rgba(var(--sh), .12);
  --line-soft: rgba(var(--sh), .07);
  --accent: var(--accent);
  --sage: var(--sage);
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
  --kaiti: "Kaiti SC", "KaiTi", "STKaiti", "Songti SC", "SimSun", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  background-image:
    radial-gradient(1100px 520px at 50% -8%, var(--bg-glow) 0%, rgba(251, 246, 236, 0) 62%),
    radial-gradient(760px 420px at 105% 104%, var(--bg-2) 0%, rgba(226, 213, 191, 0) 70%);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}

#app {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100dvh;
  padding: 26px 20px 118px;
  background: var(--paper);
  box-shadow: 0 0 0 1px rgba(var(--sh), .06), 0 0 90px rgba(var(--sh), .10);
  position: relative;
}

@media (max-width: 500px) {
  #app { padding: 20px 16px 112px; box-shadow: none; }
}

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; cursor: pointer; }

/* ---------- 通用 ---------- */

.card {
  background: var(--paper-2);
  border: 1px solid var(--line-soft);
  border-radius: 22px;
  box-shadow: 0 12px 34px -26px rgba(var(--sh), .8), inset 0 1px 0 rgba(255, 255, 255, .6);
}
.card.pad { padding: 18px; }

.head { margin: 6px 0 22px; }
.kicker {
  font-size: 11.5px; letter-spacing: .14em; color: var(--muted);
  text-transform: uppercase; margin-bottom: 8px;
}
.page-title {
  font-family: var(--serif);
  font-size: 29px; line-height: 1.25; margin: 0; font-weight: 600;
  letter-spacing: .01em;
}
.page-title em {
  font-style: normal; color: var(--accent);
  font-family: var(--sans); font-weight: 600; font-size: 30px;
  margin: 0 2px;
}
.sub { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
.foot {
  text-align: center; color: var(--muted); font-size: 11.5px;
  letter-spacing: .04em; margin: 26px 0 0; line-height: 1.8;
}
.dim { color: var(--muted); }
.small { font-size: 12px; }

.sec-title {
  font-size: 12px; letter-spacing: .1em; color: var(--muted);
  display: flex; justify-content: space-between; align-items: baseline;
  margin: 0 2px 10px;
}
.block { margin-top: 24px; }

/* ---------- 引导 ---------- */

.onboard { padding-top: 14px; text-align: center; animation: fade .5s both; }
.ob-art {
  display: block; width: 172px; height: 172px; margin: 0 auto 6px; padding: 0;
  border: 0; background: none; cursor: pointer; position: relative;
}
.ob-art::after {
  content: '✎'; position: absolute; right: 2px; bottom: 6px;
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--paper-3); border: 1.5px solid rgba(var(--accent-rgb), .55); color: var(--accent);
  font-size: 17px; line-height: 35px; text-align: center;
  box-shadow: 0 4px 12px -4px rgba(var(--sh), .35);
}
.ob-art img { width: 100%; height: 100%; display: block; border-radius: 50%; object-fit: cover; }
.ob-hint {
  display: block; margin: 0 auto 18px; padding: 6px 12px; border: 0; border-radius: 999px;
  background: transparent; color: var(--muted); font: inherit; font-size: 12.5px;
  letter-spacing: .04em; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
.ob-art svg { width: 100%; height: 100%; display: block; }
.ob-title {
  font-family: var(--serif); font-size: 34px; margin: 4px 0 10px;
  letter-spacing: .04em; font-weight: 600;
}
.ob-sub { color: var(--muted); font-size: 13.5px; line-height: 1.9; margin: 0 0 26px; }
.ob-field { text-align: left; margin-bottom: 20px; }
.ob-field label {
  display: block; font-size: 12px; letter-spacing: .08em; color: var(--muted);
  margin-bottom: 9px;
}
.ob-field label em { font-style: normal; opacity: .7; letter-spacing: 0; }
.input {
  width: 100%; height: 52px; border-radius: 15px; padding: 0 16px;
  background: var(--paper-2); border: 1px solid var(--line);
  font-size: 16px; outline: none;
  transition: border-color .2s, background .2s;
}
.input:focus { border-color: rgba(var(--accent-rgb), .55); background: var(--paper-3); }

.species { display: flex; gap: 10px; }
.sp {
  flex: 1; height: 62px; border-radius: 16px; background: var(--paper-2);
  border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
  gap: 8px; font-size: 15px; transition: .2s;
}
.sp span { font-size: 22px; }
.sp.on { border-color: var(--accent); background: var(--wash); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .08); }

.pchips { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.pchip {
  text-align: left; padding: 12px 13px; border-radius: 15px;
  background: var(--paper-2); border: 1px solid var(--line); transition: .2s;
}
.pchip b { display: block; font-size: 14.5px; font-weight: 600; margin-bottom: 2px; }
.pchip span { display: block; font-size: 11px; color: var(--muted); line-height: 1.5; }
.pchip.on { border-color: var(--accent); background: var(--wash); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .08); }

.primary {
  width: 100%; height: 52px; border-radius: 16px;
  background: var(--ink); color: var(--paper-2);
  font-size: 15px; letter-spacing: .06em;
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s, opacity .2s, box-shadow .2s;
  box-shadow: 0 10px 26px -14px rgba(var(--sh), .7);
}
.primary.big { height: 56px; margin-top: 6px; }
.primary:active { transform: scale(.985); }
.primary.disabled, .primary[disabled] { opacity: .28; box-shadow: none; }
.ghost.link {
  width: 100%; margin-top: 12px; height: 46px; color: var(--muted);
  font-size: 13px; text-decoration: underline; text-underline-offset: 4px;
  text-decoration-color: var(--line);
}
.ob-foot { color: var(--muted); font-size: 11px; margin-top: 26px; opacity: .8; }

/* ---------- 今天 ---------- */

.hero {
  display: flex; align-items: center; gap: 6px;
  padding: 14px 16px 14px 8px; margin-bottom: 26px;
}
.hero-face { width: 106px; height: 106px; flex: 0 0 106px; }
.hero-face svg { width: 100%; height: 100%; display: block; }
.hero-say { flex: 1; min-width: 0; }
.bubble {
  position: relative; background: var(--paper-3);
  border: 1px solid var(--line-soft); border-radius: 16px;
  padding: 12px 15px; font-size: 15.5px; line-height: 1.5;
  font-family: var(--serif); display: inline-block; max-width: 100%;
}
.bubble::after {
  content: ''; position: absolute; left: -5px; top: 22px;
  width: 9px; height: 9px; background: var(--paper-3);
  border-left: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft);
  transform: rotate(45deg);
}
.hero-meta { color: var(--muted); font-size: 11.5px; margin: 9px 0 0 4px; letter-spacing: .03em; }

.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chip {
  height: 60px; border-radius: 15px; background: var(--paper-2);
  border: 1px solid var(--line-soft);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; color: var(--ink-soft);
  transition: transform .12s, background .15s, border-color .15s;
}
.chip .ci { font-size: 17px; line-height: 1; }
.chip:active { transform: scale(.94); background: var(--wash); border-color: rgba(var(--accent-rgb), .35); }

.evs { background: var(--paper-2); border: 1px solid var(--line-soft); border-radius: 18px; overflow: hidden; }
.ev {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; min-height: 46px;
  border-bottom: 1px dashed rgba(var(--sh), .1);
  animation: fade .3s both;
}
.ev:last-child { border-bottom: 0; }
.ev-ic { font-size: 15px; width: 20px; text-align: center; }
.ev-name { font-size: 14px; flex: 1; }
.ev-x {
  width: 28px; height: 28px; border-radius: 9px; color: var(--muted);
  font-size: 17px; line-height: 1; display: flex; align-items: center; justify-content: center;
}
.ev-x:active { background: rgba(var(--sh), .06); }
.numwrap {
  display: flex; align-items: center; gap: 3px;
  background: var(--paper-3); border: 1px solid var(--line-soft);
  border-radius: 9px; padding: 0 8px; height: 30px;
}
.num {
  width: 52px; border: 0; background: transparent; text-align: right;
  font-size: 14px; outline: none; -moz-appearance: textfield;
}
.num::-webkit-outer-spin-button, .num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.numwrap i { font-style: normal; font-size: 11px; color: var(--muted); }
.opt {
  border: 1px solid var(--line-soft); background: var(--paper-3);
  border-radius: 9px; height: 30px; padding: 0 6px; font-size: 13px; outline: none;
}
.ev-empty {
  padding: 20px 16px; color: var(--muted); font-size: 12.5px; text-align: center; line-height: 1.7;
}

.note {
  width: 100%; margin-top: 10px; min-height: 54px; resize: none;
  background: transparent; border: 1px dashed var(--line); border-radius: 14px;
  padding: 11px 13px; font-size: 13.5px; outline: none; color: var(--ink-soft);
}
.note:focus { border-color: rgba(var(--accent-rgb), .45); }
.note::placeholder { color: var(--muted); opacity: .75; }

/* ---------- 日记卡 ---------- */

.entry { margin-top: 26px; padding: 22px 22px 16px; animation: fade .5s both; }
.entry-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.entry-day { font-size: 11px; letter-spacing: .12em; color: var(--muted); }
.mood {
  font-size: 11px; padding: 3px 9px; border-radius: 999px;
  border: 1px solid currentColor; opacity: .9; white-space: nowrap;
}
.entry-title {
  font-family: var(--serif); font-size: 24px; font-weight: 600;
  margin: 0 0 14px; line-height: 1.45; letter-spacing: .01em;
}
.entry-body { font-family: var(--kaiti); font-size: 17px; line-height: 2.02; color: var(--ink); }
.entry-body .para { margin: 0 0 13px; animation: rise .55s cubic-bezier(.2, .7, .2, 1) both; }
.entry-body .para:last-child { margin-bottom: 0; }
.stale {
  margin-top: 14px; font-size: 11.5px; color: var(--accent);
  background: var(--wash-2); border-radius: 10px; padding: 8px 11px;
}
.facts { margin-top: 18px; border-top: 1px dashed var(--line); padding-top: 12px; }
.facts summary {
  font-size: 11.5px; color: var(--muted); letter-spacing: .08em;
  cursor: pointer; list-style: none; outline: none;
}
.facts summary::-webkit-details-marker { display: none; }
.facts summary::before { content: '▸ '; opacity: .6; }
.facts[open] summary::before { content: '▾ '; }
.fact-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.fact {
  font-size: 11.5px; padding: 3px 9px; border-radius: 8px;
  background: rgba(var(--sh), .045); color: var(--ink-soft);
}
.fact.dim { color: var(--muted); }
.fact-note { font-size: 12px; color: var(--muted); margin-top: 10px; font-style: italic; }

.entry-actions { display: flex; gap: 8px; margin-top: 16px; }
.mini {
  height: 34px; padding: 0 14px; border-radius: 10px;
  background: rgba(var(--sh), .05); font-size: 12.5px; color: var(--ink-soft);
  transition: background .15s;
}
.mini:active { background: rgba(var(--sh), .1); }
.mini.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }

/* 正在写 */
.writing { text-align: center; padding: 40px 20px; }
.writing p { color: var(--muted); font-size: 13px; margin: 16px 0 0; letter-spacing: .05em; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i {
  width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .4;
  animation: blink 1.1s infinite;
}
.dots i:nth-child(2) { animation-delay: .18s; }
.dots i:nth-child(3) { animation-delay: .36s; }

/* ---------- 日记本 ---------- */

.month { margin-bottom: 22px; }
.month-label {
  font-size: 11px; letter-spacing: .12em; color: var(--muted);
  margin: 0 4px 8px;
}
.row {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 12px; border-radius: 16px;
  border-bottom: 1px solid var(--line-soft);
  transition: background .15s;
}
.row:active { background: rgba(var(--sh), .035); }
.row-date {
  flex: 0 0 40px; text-align: center; border-right: 1px solid var(--line-soft);
  padding-right: 12px;
}
.row-date b { display: block; font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.2; }
.row-date span { font-size: 10px; color: var(--muted); }
.row-main { flex: 1; min-width: 0; }
.row-title {
  font-family: var(--serif); font-size: 16px; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row-ex {
  font-size: 11.5px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; opacity: .8; }

.empty {
  text-align: center; padding: 46px 24px; margin-top: 10px;
}
.empty p { color: var(--muted); font-size: 13.5px; line-height: 1.9; margin: 14px 0 18px; }

/* ---------- 单篇 ---------- */

.backrow { margin-bottom: 14px; }
.back { font-size: 13px; color: var(--muted); padding: 6px 0; }
.entry-hero { display: flex; align-items: center; gap: 16px; margin-bottom: 4px; }
.eh-face { width: 82px; height: 82px; flex: 0 0 82px; }
.eh-face svg { width: 100%; height: 100%; }
.eh-meta { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.eh-tags { display: flex; gap: 8px; flex-wrap: wrap; }
.eh-tags span { font-size: 11px; color: var(--muted); }

/* ---------- 它 ---------- */

.pet-hero { text-align: center; padding: 12px 0 22px; }
.ph-face { width: 150px; height: 150px; margin: 0 auto; padding: 0; border: 0; background: none; cursor: pointer; position: relative; }
.ph-face::after { content: '✎'; position: absolute; right: 6px; bottom: 6px; width: 34px; height: 34px; border-radius: 50%; background: var(--paper-3); border: 1.5px solid rgba(var(--accent-rgb), .5); color: var(--accent); font-size: 15px; line-height: 31px; text-align: center; box-shadow: 0 4px 10px -4px rgba(var(--sh), .35); }
.ph-face svg { width: 100%; height: 100%; }
.ph-name { font-family: var(--serif); font-size: 28px; margin: 6px 0 4px; font-weight: 600; }
.ph-sub { color: var(--muted); font-size: 12.5px; margin: 0; letter-spacing: .03em; }

.stats { display: flex; padding: 18px 8px; }
.stat { flex: 1; text-align: center; position: relative; }
.stat + .stat::before {
  content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
  width: 1px; background: var(--line-soft);
}
.stat b { display: block; font-family: var(--serif); font-size: 23px; font-weight: 600; line-height: 1.2; }
.stat span { font-size: 10.5px; color: var(--muted); letter-spacing: .05em; }

.chart { margin-top: 2px; }
.chart svg { width: 100%; height: 74px; display: block; overflow: visible; }
.chart-meta { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 6px; }

.kv {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1px dashed var(--line-soft); font-size: 13.5px;
}
.kv:last-child { border-bottom: 0; }
.kv span { color: var(--muted); font-size: 12.5px; }
.kv b { font-weight: 500; }

/* 档案表的编辑行 */
.kv.edit { gap: 8px; }
.kv.edit > span { flex: 0 0 auto; min-width: 40px; }
.kv.edit .input { height: 34px; padding: 0 10px; font-size: 13px; min-width: 0; }
.kv.edit .fv { flex: 1 1 auto; }
.kv.edit .fl { flex: 0 0 34%; }
.kv.edit .tl-x { flex: 0 0 auto; }
.arc-save { display: flex; gap: 8px; margin-top: 12px; }
.arc-save .mini { flex: 1; height: 40px; }
.kv input[type="date"], .kv select { text-align: right; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

/* ---------- 底部导航 ---------- */

.tabs {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 100%; max-width: 460px;
  display: flex; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line-soft);
  z-index: 20;
}
body.no-tabs .tabs { display: none; }
.tab {
  flex: 1; height: 52px; border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: 10.5px; letter-spacing: .06em; transition: color .2s, background .2s;
}
.tab svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--ink); background: rgba(var(--sh), .045); }

/* ---------- toast ---------- */

#toast {
  position: fixed; left: 50%; bottom: 92px; transform: translate(-50%, 10px);
  background: rgba(var(--sh), .93); color: var(--paper-2);
  padding: 9px 16px; border-radius: 999px; font-size: 12.5px;
  opacity: 0; pointer-events: none; transition: .25s; z-index: 50;
  max-width: 80vw; text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 动画 ---------- */

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes blink {
  0%, 100% { opacity: .25; transform: translateY(0); }
  40% { opacity: .9; transform: translateY(-3px); }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- 零碎 ---------- */

.list-foot {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 22px 0 4px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .12em;
}

.mini.full { display: block; width: 100%; margin-top: 14px; height: 42px; }

.chart-meta.big { justify-content: flex-start; gap: 14px; padding-top: 2px; }
.chart-meta.big span:first-child { font-family: var(--serif); font-size: 26px; color: var(--ink); letter-spacing: .02em; }
.chart-meta.big span:last-child { color: var(--muted); font-size: 12px; }



/* ---------------- 照片 / 视频 ---------------- */

.mstrip { display: flex; flex-wrap: wrap; gap: 10px; }

.mtile {
  position: relative; width: 78px; height: 78px; border-radius: 15px; overflow: hidden;
  background: var(--paper-4); border: 1px solid var(--line-soft); cursor: pointer;
}
.mtile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mtile img.muted { opacity: 0; }
.mtile .mblank { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 11px; color: var(--muted); }

.mtile-x {
  position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; padding: 0;

nction (d) {    var m = d.getMonth() + 1, day = d.getDate();    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;  };  PT.daysBetween = function (a, b) {    var d1 = PT.parseDate(a), d2 = PT.parseDate(b);    return Math.round((d2 - d1) / 86400000);  };  PT.fmtCN = function (key) {    var d = PT.parseDate(key);    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + PT.weekday[d.getDay()];  };  PT.fmtShort = function (key) {    var d = PT.parseDate(key);    return (d.getMonth() + 1) + '月' + d.getDate() + '日';  };  PT.fmtYMD = function (key) {    var d = PT.parseDate(key);    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';  };  PT.escape = function (s) {    return String(s == null ? '' : s)      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');  };
  /* ---------- 自己加的品种（存在 store 里，运行时注册进来） ---------- */
  PT.BREED_EXTRA = [];
  PT.setExtraBreeds = function (list) { PT.BREED_EXTRA = (list || []).slice(); };
  PT.breedList = function (species) {

  PT.breedById = function (species, id) {

<script>
/* art.js — 手绘风格 SVG：宠物表情、爪印、空状态小画
   猫狗的脸按品种改五官：头形、耳朵（立耳/垂耳/半立/卷毛球）、口鼻（白口罩）、额头白斑、眼罩、眉毛 */
(function () {
  'use strict';
  var PT = (window.PT = window.PT || {});

  var INK = '#3A322C';
  var FUR = '#EFE3D0';
  var FUR_D = '#E2D2BB';
  var ACC = '#C2613F';
  var BLUSH = '#D98A72';
  var CREAM = '#F6EEE1';
  var PINK = '#D79A93';

  function esc(n) { return (Math.round(n * 10) / 10).toString(); }

  function lum(hex) {
    var n = parseInt(String(hex).replace('#', ''), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return (r * 0.299 + g * 0.587 + b * 0.114) / 255;
  }

  /* 猫：脸型按品种微调 */
  var CAT_TRAITS = {

  };

  /* 狗：决定「像不像」的几个关键——耳朵、头形、口鼻、白斑、眉毛 */
  var DOG_TRAITS = {
    shiba: { ears: 'prick', head: 'wedge', muzzle: 'cream', brows: true, cheeks: true },

    husky: { ears: 'prick', head: 'broad', muzzle: 'cream', blaze: true, mask: true },
    samoyed: { ears: 'prick', earScale: 1.1, head: 'broad', muzzle: 'cream', smile: true, chest: true, mz: 1.06 },
    bichon: { ears: 'drop', head: 'round', cloud: true, muzzle: 'short', mz: 0.92 },

    schnauzer: { ears: 'semi', head: 'broad', muzzle: 'beard', browLight: true },

  function pal(b) {

      id: b.id || '',

      furD: b.furD || FUR_D,

      dark: lum(fur) < 0.55,

    };
  }

  /* ---------------- 眼睛 ---------------- */

  function eye(cx, cy, kind, species, r, tint) {
    r = r || 1;
    var sw = 2.2;
    var s = 'fill="none" stroke="' + INK + '" stroke-width="' + sw + '" stroke-linecap="round"';
    var pupFill = tint ? 'fill="' + tint + '"' : 'fill="' + INK + '"';
    var w = 10 * r, h = 11 * r;
    switch (kind) {
      case 'open':
        if (species === 'dog') {
          return '<ellipse cx="' + esc(cx) + '" cy="' + esc(cy) + '" rx="' + esc(w * 0.85) + '" ry="' + esc(h * 0.9) + '" fill="#fff" stroke="' + INK + '" stroke-width="2"/>' +
            '<circle cx="' + esc(cx) + '" cy="' + esc(cy + 1) + '" r="' + esc(5.2 * r) + '" ' + pupFill + '/>' +
            '<circle cx="' + esc(cx - 2) + '" cy="' + esc(cy - 2.4) + '" r="1.5" fill="#fff"/>';
        }
        return '<ellipse cx="' + esc(cx) + '" cy="' + esc(cy) + '" rx="' + esc(w * 0.8) + '" ry="' + esc(h * 0.9) + '" fill="#fff" stroke="' + INK + '" stroke-width="1.8"/>' +
          '<ellipse cx="' + esc(cx) + '" cy="' + esc(cy + 0.5) + '" rx="' + esc(2.6 * r) + '" ry="' + esc(7.4 * r) + '" ' + pupFill + '/>' +
          '<circle cx="' + esc(cx - 1.4) + '" cy="' + esc(cy - 3.4) + '" r="1.3" fill="#fff"/>';
      case 'happy':

      case 'closed':
        return '<path d="M' + esc(cx - w) + ' ' + esc(cy) + ' Q' + esc(cx) + ' ' + esc(cy + 8 * r) + ' ' + esc(cx + w) + ' ' + esc(cy) + '" ' + s + '/>';
      case 'half':
        return '<path d="M' + esc(cx - w) + ' ' + esc(cy - 2) + ' Q' + esc(cx) + ' ' + esc(cy + 5 * r) + ' ' + esc(cx + w) + ' ' + esc(cy - 2) + '" ' + s + '/>' +
          '<path d="M' + esc(cx - w) + ' ' + esc(cy - 4) + ' L' + esc(cx + w) + ' ' + esc(cy - 4) + '" ' + s + '/>';
      case 'big':
        return '<ellipse cx="' + esc(cx) + '" cy="' + esc(cy) + '" rx="' + esc(w) + '" ry="' + esc(h * 1.05) + '" fill="#fff" stroke="' + INK + '" stroke-width="2"/>' +
          '<circle cx="' + esc(cx) + '" cy="' + esc(cy + 1) + '" r="' + esc(5.6 * r) + '" ' + pupFill + '/>' +
          '<circle cx="' + esc(cx - 2.2) + '" cy="' + esc(cy - 2.6) + '" r="2" fill="#fff"/>' +
          '<circle cx="' + esc(cx + 3.2) + '" cy="' + esc(cy + 3.6) + '" r="1.1" fill="#fff"/>';
      case 'sick':
        return '<path d="M' + esc(cx - w) + ' ' + esc(cy + 4) + ' Q' + esc(cx) + ' ' + esc(cy - 4) + ' ' + esc(cx + w) + ' ' + esc(cy + 4) + '" ' + s + '/>' +
          '<path d="M' + esc(cx - 3) + ' ' + esc(cy - 7) + ' Q' + esc(cx) + ' ' + esc(cy - 3) + ' ' + esc(cx + 3) + ' ' + esc(cy - 7) + '" ' + s + '/>';
      case 'sleep':
        return '<path d="M' + esc(cx - w) + ' ' + esc(cy + 2) + ' Q' + esc(cx) + ' ' + esc(cy + 9 * r) + ' ' + esc(cx + w) + ' ' + esc(cy + 2) + '" ' + s + '/>';
      default:
        return '';
    }
  }

  function blush(cx, cy, r) {
    return '<ellipse cx="' + esc(cx) + '" cy="' + esc(cy) + '" rx="' + esc(r) + '" ry="' + esc(r * 0.62) + '" fill="' + BLUSH + '" opacity=".38"/>';
  }

  var E = { open: 'open', happy: 'happy', love: 'happy', proud: 'half', sick: 'sick', sleepy: 'sleep', excited: 'big' };
  function eyeKind(mood) { return E[mood] || 'open'; }

  /* ---------------- 耳朵 ---------------- */

  function catEars(p) {
    var inner = p.dark ? CREAM : PINK;
    var fill = p.fur;
    return '<path d="M58 66 L46 18 L94 44 Z" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<path d="M62 60 L54 32 L86 47 Z" fill="' + inner + '"/>' +
      '<path d="M142 66 L154 18 L106 44 Z" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<path d="M138 60 L146 32 L114 47 Z" fill="' + inner + '"/>';
  }

  function dogEars(t, p) {
    var fill = p.fur;
    if (t.ears === 'prick') {
      var s = '<path d="M64 72 L46 20 L98 46 Z" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>' +
        '<path d="M66 64 L55 33 L87 48 Z" fill="' + CREAM + '" opacity=".34"/>' +
        '<path d="M136 72 L154 20 L102 46 Z" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>' +
        '<path d="M134 64 L145 33 L113 48 Z" fill="' + CREAM + '" opacity=".34"/>';
      var k = t.earScale || (t.earSmall ? 0.84 : 1);
      return k === 1 ? s : '<g transform="translate(100 96) scale(' + k + ') translate(-100 -96)">' + s + '</g>';
    }
    if (t.ears === 'semi') {
      return '<path d="M62 74 L42 28 Q62 16 84 40 Z" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>' +
        '<path d="M138 74 L158 28 Q138 16 116 40 Z" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>' +
        '<path d="M46 40 Q60 34 74 46" fill="none" stroke="' + INK + '" stroke-width="1.6" opacity=".45"/>' +
        '<path d="M154 40 Q140 34 126 46" fill="none" stroke="' + INK + '" stroke-width="1.6" opacity=".45"/>';
    }
    if (t.ears === 'puff') {
      return '<circle cx="58" cy="70" r="19" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.4"/>' +
        '<circle cx="142" cy="70" r="19" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.4"/>' +
        '<circle cx="50" cy="57" r="12" fill="' + fill + '" stroke="' + INK + '" stroke-width="2"/>' +
        '<circle cx="150" cy="57" r="12" fill="' + fill + '" stroke="' + INK + '" stroke-width="2"/>';
    }
    if (t.ears === 'drop') {
      /* 比熊：垂在两侧的圆毛耳，位置低、贴脸 */
      return '<circle cx="44" cy="108" r="19" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.4"/>' +
        '<circle cx="156" cy="108" r="19" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.4"/>' +
        '<circle cx="36" cy="130" r="12" fill="' + fill + '" stroke="' + INK + '" stroke-width="2"/>' +
        '<circle cx="164" cy="130" r="12" fill="' + fill + '" stroke="' + INK + '" stroke-width="2"/>';
    }
    if (t.ears === 'long') {
      /* 西施 / 马尔济斯：从头顶垂到下巴的长毛，画在头后面 */
      return '<path d="M64 50 C32 58 22 112 30 152 C33 170 58 170 64 152 C74 118 76 78 72 52 Z" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>' +
        '<path d="M136 50 C168 58 178 112 170 152 C167 170 142 170 136 152 C126 118 124 78 128 52 Z" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>' +
        '<path d="M50 80 q-8 26 -5 52" fill="none" stroke="' + p.furD + '" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>' +
        '<path d="M150 80 q8 26 5 52" fill="none" stroke="' + p.furD + '" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>';
    }
    /* flop：垂耳，挂在脸两侧 */
    return '<path d="M66 58 C34 46 20 88 26 122 C30 146 48 156 58 140 C68 122 70 84 66 58 Z" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<path d="M134 58 C166 46 180 88 174 122 C170 146 152 156 142 140 C132 122 130 84 134 58 Z" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>';
  }

  /* 萨摩耶那种毛茸茸的立耳：短、圆、外缘有弧度 */
  function fluffyEars(p) {
    return '<path d="M66 76 Q40 50 54 26 Q80 24 96 50 Z" fill="' + p.fur + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<path d="M134 76 Q160 50 146 26 Q120 24 104 50 Z" fill="' + p.fur + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<path d="M68 68 Q52 50 60 36 Q78 38 88 52 Z" fill="' + CREAM + '" opacity=".5"/>' +
      '<path d="M132 68 Q148 50 140 36 Q122 38 112 52 Z" fill="' + CREAM + '" opacity=".5"/>';
  }

  /* ---------------- 头形 ---------------- */

  /* 毛球轮廓：用一段段外凸的圆弧拼出一圈毛边，避免多个描边圆互相露出接缝 */
  function scallop(cx, cy, R, n, bulge, fill, stroke, sw) {
    var pts = [], i, a, d;
    for (i = 0; i < n; i++) {
      a = (Math.PI * 2 * i) / n - Math.PI / 2;
      pts.push([cx + Math.cos(a) * R, cy + Math.sin(a) * R]);
    }
    d = 'M' + esc(pts[0][0]) + ' ' + esc(pts[0][1]);
    for (i = 1; i <= n; i++) {
      var q = pts[i % n];
      d += ' A' + esc(bulge) + ' ' + esc(bulge) + ' 0 0 1 ' + esc(q[0]) + ' ' + esc(q[1]);
    }
    return '<path d="' + d + ' Z" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + (sw || 2.4) + '" stroke-linejoin="round"/>';
  }

  function headShape(t, p, species) {
    var attrs = 'fill="' + p.fur + '" stroke="' + INK + '" stroke-width="2.6" stroke-linejoin="round"';
    if (species === 'cat') {
      return '<ellipse cx="100" cy="104" rx="' + (t.cheek ? 62 : 58) + '" ry="' + (t.cheek ? 54 : 53) + '" ' + attrs + '/>';
    }
    if (t.cloud) {
      return scallop(100, 104, 54, 9, 21, p.fur, INK, 2.4) +
        '<ellipse cx="100" cy="104" rx="52" ry="47" fill="' + p.fur + '"/>';
    }
    if (t.head === 'round') {
      return '<ellipse cx="100" cy="104" rx="58" ry="53" ' + attrs + '/>';
    }
    if (t.head === 'wedge') {
      /* 柴犬 / 田园犬：上宽下收，脸略尖 */
      return '<path d="M42 92 Q44 54 100 50 Q156 54 158 92 Q156 138 100 150 Q44 138 42 92 Z" ' + attrs + '/>';
    }
    return '<ellipse cx="100" cy="102" rx="61" ry="52" ' + attrs + '/>';
  }

  /* ---------------- 花纹 ---------------- */

  function catMark(p) {
    var s = '';
    if (p.pattern === 'tabby') {
      s += '<g fill="none" stroke="' + p.furD + '" stroke-width="5" stroke-linecap="round" opacity=".75">' +
        '<path d="M86 74 q3 -9 -3 -17"/><path d="M100 70 q0 -11 0 -19"/><path d="M114 74 q-3 -9 3 -17"/>' +
        '<path d="M52 106 q-7 3 -10 9"/><path d="M148 106 q7 3 10 9"/>' +
        '</g>';
    } else if (p.pattern === 'patch') {
      s += '<path d="M54 74 q26 -22 46 -2 q8 14 -8 18 q-30 8 -38 -16 z" fill="' + p.furD + '" opacity=".9"/>' +
        '<path d="M140 60 q12 8 10 22 q-10 4 -14 -8 z" fill="' + p.furD + '" opacity=".8"/>';
    } else if (p.pattern === 'calico') {
      s += '<path d="M56 76 q22 -22 40 -2 q8 14 -8 18 q-28 8 -32 -16 z" fill="' + p.furD + '" opacity=".88"/>' +
        '<path d="M118 84 q22 -8 30 8 q4 15 -15 16 q-19 0 -15 -24 z" fill="#C4835A" opacity=".72"/>' +
        '<ellipse cx="100" cy="116" rx="15" ry="9" fill="' + p.furD + '" opacity=".3"/>';
    } else if (p.pattern === 'point') {
      s += '<ellipse cx="100" cy="120" rx="27" ry="19" fill="' + p.furD + '" opacity=".5"/>';
    }
    return s;
  }

  function dogMark(t, p) {
    var s = '';
    if (t.blaze) {
      s += '<path d="M100 50 Q110 62 108 84 L108 112 Q100 118 92 112 L92 84 Q90 62 100 50 Z" fill="' + CREAM + '" opacity=".92"/>';
    }
    if (t.mask) {
      s += '<ellipse cx="76" cy="92" rx="20" ry="15" fill="' + p.furD + '" opacity=".55"/>' +
        '<ellipse cx="124" cy="92" rx="20" ry="15" fill="' + p.furD + '" opacity=".55"/>';
    }
    if (p.pattern === 'patch' && !t.blaze) {
      s += '<path d="M104 50 q34 -4 40 30 q-6 22 -28 16 q-18 -8 -12 -46 z" fill="' + p.furD + '" opacity=".85"/>';
    }
    if (t.brows) {
      s += '<path d="M70 76 q6 -4 12 -2" fill="none" stroke="' + INK + '" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>' +
        '<path d="M130 76 q-6 -4 -12 -2" fill="none" stroke="' + INK + '" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>';
    }
    if (t.browLight) {
      /* 雪纳瑞的浓白眉 */
      s += '<path d="M64 84 q11 -9 23 -4" fill="none" stroke="' + CREAM + '" stroke-width="8" stroke-linecap="round"/>' +
        '<path d="M136 84 q-11 -9 -23 -4" fill="none" stroke="' + CREAM + '" stroke-width="8" stroke-linecap="round"/>';
    }
    if (t.topknot === 'bow') {
      s += '<path d="M100 46 l-17 -11 q-6 11 0 22 q12 0 17 -11 z" fill="' + ACC + '" opacity=".9" stroke="' + INK + '" stroke-width="1.6" stroke-linejoin="round"/>' +
        '<path d="M100 46 l17 -11 q6 11 0 22 q-12 0 -17 -11 z" fill="' + ACC + '" opacity=".9" stroke="' + INK + '" stroke-width="1.6" stroke-linejoin="round"/>' +
        '<circle cx="100" cy="46" r="4.5" fill="' + ACC + '" stroke="' + INK + '" stroke-width="1.6"/>';
    }
    if (t.topknot === true) {
      s += '<circle cx="100" cy="42" r="20" fill="' + p.furD + '" stroke="' + INK + '" stroke-width="2.2"/>' +
        '<path d="M86 34 q14 -8 28 0" fill="none" stroke="' + INK + '" stroke-width="1.5" opacity=".35"/>';
    }
    return s;
  }

  /* ---------------- 口鼻 ---------------- */

  function dogMuzzle(t, p, mouth) {
    var style = t.muzzle || 'cream';
    var mx = (style === 'cream' || style === 'beard') ? CREAM : p.furD;
    var s = t.mz || 1;
    var y = 126, rx = 27 * s, ry = 18 * s, op = style === 'same' ? '.5' : '.95';
    if (style === 'short') { rx = 23 * s; ry = 15 * s; y = 124; }
    var beard = style === 'beard'
      ? '<path d="M72 114 q28 -10 56 0 q-2 36 -28 38 q-26 -2 -28 -38 z" fill="' + CREAM + '" opacity=".95"/>' +
        '<path d="M84 140 q16 6 32 0" fill="none" stroke="' + INK + '" stroke-width="1.6" opacity=".25"/>'
      : '';
    var noseW = 28 * Math.max(s, .8);
    return beard +
      '<ellipse cx="100" cy="' + esc(y) + '" rx="' + esc(rx) + '" ry="' + esc(ry) + '" fill="' + mx + '" opacity="' + op + '"/>' +
      '<path d="M' + esc(100 - noseW / 2) + ' ' + esc(y - 14) + ' q' + esc(noseW / 2) + ' -5 ' + esc(noseW) + ' 0 q-2 12 -' + esc(noseW / 2) + ' 13 q-' + esc(noseW / 2 - 2) + ' -1 -' + esc(noseW / 2) + ' -13 z" fill="' + INK + '" opacity=".92" transform="translate(0,-2)"/>' +
      '<ellipse cx="95" cy="' + esc(y - 17) + '" rx="3" ry="1.8" fill="#fff" opacity=".45"/>' +
      mouth;
  }

  /* ---------------- 猫脸 ---------------- */

  function catFace(mood, o) {
    o = o || {};
    var p = pal(o.breed);
    var t = CAT_TRAITS[p.id] || { ears: 'point' };
    var kind = eyeKind(mood);
    var eyeR = t.big ? 1.1 : 1;
    var eyes = eye(80, 98, kind, 'cat', eyeR, p.eye) + eye(120, 98, kind, 'cat', eyeR, p.eye);
    var mouth = '';
    var extra = '';

    if (mood === 'happy' || mood === 'love' || mood === 'excited') {
      mouth = '<path d="M88 122 Q100 136 112 122" fill="none" stroke="' + p.line + '" stroke-width="2.2" stroke-linecap="round"/>' +
        '<path d="M96 129 Q100 136 104 129 Q100 133 96 129 Z" fill="' + ACC + '" opacity=".85"/>';
    } else if (mood === 'proud') {
      mouth = '<path d="M88 124 Q94 131 100 125" fill="none" stroke="' + p.line + '" stroke-width="2.2" stroke-linecap="round"/>' +
        '<path d="M100 125 Q106 119 113 124" fill="none" stroke="' + p.line + '" stroke-width="2.2" stroke-linecap="round"/>';
    } else if (mood === 'sick') {
      mouth = '<path d="M89 126 Q94 122 99 126 Q104 130 111 124" fill="none" stroke="' + p.line + '" stroke-width="2.2" stroke-linecap="round"/>';
      extra = '<path d="M148 62 q7 9 0 13 q-7 -4 0 -13 z" fill="#9DB0C6" opacity=".85"/>' +
        '<path d="M152 74 q4 4 0 7" fill="none" stroke="#9DB0C6" stroke-width="1.6" stroke-linecap="round"/>';
    } else if (mood === 'sleepy') {
      mouth = '<path d="M94 124 q6 5 12 0" fill="none" stroke="' + p.line + '" stroke-width="2.2" stroke-linecap="round"/>';
      extra = '<text x="150" y="52" font-size="15" fill="' + p.line + '" opacity=".55" font-family="Georgia,serif">z</text>' +
        '<text x="162" y="38" font-size="11" fill="' + p.line + '" opacity=".45" font-family="Georgia,serif">z</text>';
    } else {
      mouth = '<path d="M100 116 L100 121" stroke="' + p.line + '" stroke-width="2.2" stroke-linecap="round"/>' +
        '<path d="M100 121 q-6 7 -12 2" fill="none" stroke="' + p.line + '" stroke-width="2.2" stroke-linecap="round"/>' +
        '<path d="M100 121 q6 7 12 2" fill="none" stroke="' + p.line + '" stroke-width="2.2" stroke-linecap="round"/>';
    }

    if (mood === 'love') {
      extra += blush(64, 116, 10) + blush(136, 116, 10) +
        '<path d="M152 70 c3 -5 10 -3 9 2 c-1 5 -9 9 -9 9 s-8 -4 -9 -9 c-1 -5 6 -7 9 -2 z" fill="' + ACC + '" opacity=".55"/>';
    }
    if (mood === 'happy') extra += blush(64, 116, 9) + blush(136, 116, 9);

    var whisk = '';
    [[-1, 0], [-1, 1], [-1, 2], [1, 0], [1, 1], [1, 2]].forEach(function (w) {
      var x0 = 100 + w[0] * 34, x1 = 100 + w[0] * (62 + w[1] * 2);
      var y0 = 112 + w[1] * 7, y1 = 108 + w[1] * 9;
      whisk += '<path d="M' + esc(x0) + ' ' + esc(y0) + ' L' + esc(x1) + ' ' + esc(y1) + '" stroke="' + p.line + '" stroke-width="1.4" opacity="' + (p.dark ? '.4' : '.55') + '" stroke-linecap="round"/>';
    });

    var cheeks = '';

    return '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="face-svg" role="img" aria-label="它">' +
      '<g transform="rotate(' + (o.tilt != null ? o.tilt : -1.5) + ' 100 104)">' +
      catEars(p) +
      cheeks +
      headShape(t, p, 'cat') +
      catMark(p) +
      '<path d="M84 58 q4 -8 0 -14 M100 54 q4 -9 0 -15 M116 58 q4 -8 0 -14" fill="none" stroke="' + p.furD + '" stroke-width="3" stroke-linecap="round" opacity=".8"/>' +
      eyes +
      '<path d="M94 110 L106 110 L100 117 Z" fill="' + ACC + '" opacity=".9"/>' +
      mouth + whisk + extra +
      '</g></svg>';
  }

  /* ---------------- 狗脸 ---------------- */

  function dogFace(mood, o) {
    o = o || {};
    var p = pal(o.breed);
    var t = DOG_TRAITS[p.id] || { ears: 'flop', head: 'broad', muzzle: 'cream' };
    var kind = eyeKind(mood);
    var eyes = eye(78, 96, kind, 'dog', 1.05, p.eye) + eye(122, 96, kind, 'dog', 1.05, p.eye);
    var extra = '';
    var mouth;

    if (mood === 'happy' || mood === 'love' || mood === 'excited') {
      mouth = '<path d="M86 130 q14 17 28 0" fill="' + ACC + '" opacity=".2" stroke="' + p.line + '" stroke-width="2.2" stroke-linejoin="round"/>' +
        '<path d="M92 137 q8 13 16 0" fill="' + ACC + '" opacity=".7"/>';
    } else if (mood === 'proud') {
      mouth = '<path d="M84 130 q16 8 32 -2" fill="none" stroke="' + p.line + '" stroke-width="2.2" stroke-linecap="round"/>';
    } else if (mood === 'sick') {
      mouth = '<path d="M86 132 q7 -5 14 0 q7 5 14 0" fill="none" stroke="' + p.line + '" stroke-width="2.2" stroke-linecap="round"/>';
      extra = '<path d="M150 62 q7 9 0 13 q-7 -4 0 -13 z" fill="#9DB0C6" opacity=".85"/>';
    } else if (mood === 'sleepy') {
      mouth = '<ellipse cx="100" cy="133" rx="5" ry="4" fill="none" stroke="' + p.line + '" stroke-width="2"/>';
      extra = '<text x="150" y="52" font-size="15" fill="' + p.line + '" opacity=".5" font-family="Georgia,serif">z</text>' +
        '<text x="162" y="38" font-size="11" fill="' + p.line + '" opacity=".4" font-family="Georgia,serif">z</text>';
    } else if (t.smile) {
      /* 萨摩耶那种「在笑」的嘴 */
      mouth = '<path d="M100 132 q-10 8 -17 1" fill="none" stroke="' + p.line + '" stroke-width="2.4" stroke-linecap="round"/>' +
        '<path d="M100 132 q10 8 17 1" fill="none" stroke="' + p.line + '" stroke-width="2.4" stroke-linecap="round"/>' +
        '<path d="M86 126 q14 12 28 0" fill="none" stroke="' + p.line + '" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>';
    } else {
      mouth = '<path d="M100 134 q-9 6 -14 0" fill="none" stroke="' + p.line + '" stroke-width="2.2" stroke-linecap="round"/>' +
        '<path d="M100 134 q9 6 14 0" fill="none" stroke="' + p.line + '" stroke-width="2.2" stroke-linecap="round"/>';
    }
    if (mood === 'love') extra += blush(62, 114, 10) + blush(138, 114, 10);
    if (mood === 'happy') extra += blush(62, 114, 9) + blush(138, 114, 9);

    var cheeks = t.cheeks
      ? '<ellipse cx="60" cy="120" rx="15" ry="13" fill="' + CREAM + '" opacity=".95"/>' +
        '<ellipse cx="140" cy="120" rx="15" ry="13" fill="' + CREAM + '" opacity=".95"/>'
      : '';
    var bib = '';
    if (t.chest) {
      /* 下巴下面露出来的几撮毛：画在头后面，只留外缘，像一圈毛边 */
      bib = '<circle cx="74" cy="146" r="16" fill="' + p.fur + '" stroke="' + INK + '" stroke-width="2.4"/>' +
        '<circle cx="100" cy="152" r="17" fill="' + p.fur + '" stroke="' + INK + '" stroke-width="2.4"/>' +
        '<circle cx="126" cy="146" r="16" fill="' + p.fur + '" stroke="' + INK + '" stroke-width="2.4"/>';
    }

    return '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="face-svg" role="img" aria-label="它">' +
      '<g transform="rotate(' + (o.tilt != null ? o.tilt : -1.5) + ' 100 104)">' +
      (t.fluffEars ? fluffyEars(p) : dogEars(t, p)) +
      bib +
      headShape(t, p, 'dog') +
      dogMark(t, p) +
      cheeks +
      dogMuzzle(t, p, '') +
      eyes +
      mouth + extra +
      '</g></svg>';
  }

  function face(species, mood, o) {
    return (species === 'dog' ? dogFace : catFace)(mood || 'calm', o || {});
  }

  function paw(size, color) {
    size = size || 24;
    color = color || INK;
    return '<svg viewBox="0 0 64 64" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<g fill="' + color + '">' +
      '<ellipse cx="32" cy="42" rx="13" ry="11"/>' +
      '<ellipse cx="15" cy="27" rx="6" ry="7.5"/>' +
      '<ellipse cx="26" cy="18" rx="6" ry="8"/>' +
      '<ellipse cx="38" cy="18" rx="6" ry="8"/>' +
      '<ellipse cx="49" cy="27" rx="6" ry="7.5"/>' +
      '</g></svg>';
  }

  PT.ART = { face: face, paw: paw, INK: INK, FUR: FUR, ACC: ACC };
})();
